# =====================================
# FILE: helm/employeeprofileapp/templates/networkpolicy.yaml
# VERSION: v5-enterprise-disposable-final
# =====================================

{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}

apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:

  name: {{ default "employeeprofileapp" .Values.app.name }}-network-policy

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default .Chart.Name .Values.app.name }}

spec:

  podSelector:

    matchLabels:

      app: {{ default .Chart.Name .Values.app.name }}

  policyTypes:

    - Ingress

    - Egress

  ingress:

    # =====================================
    # ALLOW SAME APPLICATION TRAFFIC
    # =====================================

    - from:

        - podSelector:

            matchLabels:

              app: {{ default .Chart.Name .Values.app.name }}

    # =====================================
    # ALLOW INGRESS CONTROLLER TRAFFIC
    # =====================================

    - from:

        - namespaceSelector:

            matchLabels:

              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}

      ports:

        - protocol: TCP

          port: {{ .Values.service.targetPort }}

  egress:

    # =====================================
    # ALLOW DNS
    # =====================================

    - to:

        - namespaceSelector:

            matchLabels:

              kubernetes.io/metadata.name: kube-system

      ports:

        - protocol: UDP

          port: 53

        - protocol: TCP

          port: 53

    # =====================================
    # ALLOW HTTPS OUTBOUND
    # REQUIRED FOR:
    # - AZURE KEY VAULT
    # - OIDC TOKEN FLOW
    # - MICROSOFT LOGIN
    # =====================================

    - ports:

        - protocol: TCP

          port: 443

    # =====================================
    # ALLOW SAME NAMESPACE TRAFFIC
    # =====================================

    - to:

        - namespaceSelector:

            matchLabels:

              kubernetes.io/metadata.name: {{ .Release.Namespace }}

{{- end }}
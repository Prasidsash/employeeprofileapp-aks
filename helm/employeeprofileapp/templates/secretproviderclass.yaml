# =====================================
# FILE: helm/employeeprofileapp/templates/secretproviderclass.yaml
# VERSION: v9-enterprise-null-safe-final
# =====================================

{{- if and .Values.keyVault .Values.keyVault.enabled }}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: {{ default "employeeprofileapp-spc" .Values.secretProviderClass.name }}
  namespace: {{ .Release.Namespace }}

  labels:
    app: {{ default .Chart.Name .Values.app.name }}

spec:
  provider: azure

  # =====================================
  # KUBERNETES SECRET SYNC
  # =====================================

  {{- if .Values.secretProviderClass.objects }}

  secretObjects:

    - secretName: {{ default "employeeprofileapp-kv-secret" .Values.keyVault.k8sSecretName }}
      type: Opaque

      data:

        {{- range .Values.secretProviderClass.objects }}

        - objectName: {{ .objectName }}
          key: {{ .objectName }}

        {{- end }}

  {{- end }}

  parameters:

    # =====================================
    # ENTERPRISE WORKLOAD IDENTITY
    # =====================================

    usePodIdentity: "{{ default "false" .Values.secretProviderClass.usePodIdentity }}"
    useVMManagedIdentity: "{{ default "false" .Values.secretProviderClass.useVMManagedIdentity }}"

    clientID: "{{ .Values.workloadIdentity.clientId }}"

    # =====================================
    # AZURE KEY VAULT
    # =====================================

    keyvaultName: "{{ .Values.keyVault.name }}"
    tenantId: "{{ .Values.workloadIdentity.tenantId }}"
    cloudName: "{{ default "AzurePublicCloud" .Values.keyVault.cloudName }}"

    # =====================================
    # SECRET ROTATION
    # =====================================

    enableSecretRotation: "true"

    # =====================================
    # KUBERNETES SECRET SYNC
    # =====================================

    syncSecret: "true"

    # =====================================
    # KEY VAULT OBJECTS
    # =====================================

    objects: |
      array:

        {{- range .Values.secretProviderClass.objects }}

        - |
          objectName: {{ .objectName }}
          objectType: {{ default "secret" .objectType }}
          objectVersion: ""

        {{- end }}

{{- end }}
# =====================================
# FILE: helm/employeeprofileapp/values-dev.yaml
# VERSION: v10-enterprise-disposable-final
# =====================================

# =====================================
# APPLICATION
# =====================================

app:

  name: employeeprofileapp

# =====================================
# NAMESPACE
# =====================================

namespaceOverride: employeeprofileapp-dev

# =====================================
# REPLICA CONFIGURATION
# =====================================

replicaCount: 1

# =====================================
# IMAGE
# =====================================

image:

  repository: empprofacr2026.azurecr.io/employeeprofileapp-aks

  tag: latest

  pullPolicy: Always

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets: []

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:

  create: true

  name: employee-sa

  annotations:

    azure.workload.identity/client-id: ""

# =====================================
# WORKLOAD IDENTITY
# =====================================

workloadIdentity:

  enabled: true

  clientId: ""

  tenantId: ""

# =====================================
# POD LABELS
# =====================================

podLabels:

  app: employeeprofileapp

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations:

  azure.workload.identity/use: "true"

# =====================================
# SECURITY CONTEXT
# =====================================

podSecurityContext:

  runAsNonRoot: true

  fsGroup: 2000

securityContext:

  allowPrivilegeEscalation: false

  readOnlyRootFilesystem: false

  runAsNonRoot: true

  runAsUser: 1000

  capabilities:

    drop:

      - ALL

# =====================================
# SERVICE
# =====================================

service:

  type: ClusterIP

  port: 80

  targetPort: 8080

  annotations: {}

# =====================================
# INGRESS
# =====================================

ingress:

  enabled: true

  className: nginx

  host: dev.employee.local

  path: /

  pathType: Prefix

  annotations:

    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  tls:

    enabled: false

    secretName: null

# =====================================
# RESOURCES
# =====================================

resources:

  requests:

    cpu: 100m

    memory: 128Mi

  limits:

    cpu: 500m

    memory: 512Mi

# =====================================
# AUTOSCALING
# =====================================

hpa:

  enabled: false

  minReplicas: 1

  maxReplicas: 2

  averageUtilization: 70

  memoryAverageUtilization: 80

  stabilizationWindowSeconds: 300

# =====================================
# NODE SELECTOR
# =====================================

nodeSelector: {}

# =====================================
# TOLERATIONS
# =====================================

tolerations: []

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# CONFIGMAP
# =====================================

extraConfig: {}

configMapAnnotations: {}

# =====================================
# NETWORK POLICY
# =====================================

networkPolicy:

  enabled: true

  ingressControllerNamespace: ingress-nginx

# =====================================
# KEY VAULT
# =====================================

keyVault:

  enabled: true

  keyVaultName: ""

  tenantId: ""

  cloudName: AzurePublicCloud

  secretProviderClass: employeeprofileapp-spc

  k8sSecretName: employeeprofileapp-kv-secret

  secrets:

    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

# =====================================
# SECRET PROVIDER CLASS
# =====================================

secretProviderClass:

  enabled: true

# =====================================
# SECRET MOUNT
# =====================================

secretMounts:

  enabled: true

  mountPath: /mnt/secrets-store

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:

  ASPNETCORE_ENVIRONMENT: Development

  KEYVAULT_NAME: ""

# =====================================
# PROBES
# =====================================

livenessProbe:

  enabled: true

  path: /

  initialDelaySeconds: 30

  periodSeconds: 10

readinessProbe:

  enabled: true

  path: /

  initialDelaySeconds: 20

  periodSeconds: 10

startupProbe:

  enabled: true

  path: /

  failureThreshold: 30

  periodSeconds: 10

# =====================================
# RBAC
# =====================================

rbac:

  create: true

# =====================================
# PDB
# =====================================

pdb:

  enabled: false

# =====================================
# OPTIONAL EXTRA VOLUMES
# =====================================

extraVolumes: []

extraVolumeMounts: []
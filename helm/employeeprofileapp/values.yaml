replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:
  name: ""

# =====================================
# IMAGE
# =====================================

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# =====================================
# SERVICE
# =====================================

service:
  type: LoadBalancer

  port: 80
  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# OPTIONAL SERVICE SETTINGS
# (Preserves existing behavior)
# =====================================

serviceSettings:
  enableLoadBalancer: false

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:
    cpu: ""
    memory: ""

  limits:
    cpu: ""
    memory: ""

# =====================================
# INGRESS
# =====================================

ingress:
  enabled: false

  className: ""

  host: ""

  path: /
  pathType: Prefix

  annotations: {}

  tls:
    enabled: false
    secretName: ""

# =====================================
# HPA
# =====================================

hpa:
  enabled: false

  minReplicas: 1
  maxReplicas: 1

  averageUtilization: 70

  memoryAverageUtilization: null

  stabilizationWindowSeconds: 300

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:
  ASPNETCORE_ENVIRONMENT: Development

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets: []

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations: {}

# =====================================
# NODE SELECTOR
# =====================================

nodeSelector: {}

# =====================================
# TOLERATIONS
# =====================================

tolerations: []

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# PROBES
# =====================================

readinessProbe:
  enabled: false

  path: /
  port: 8080

  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: false

  path: /
  port: 8080

  initialDelaySeconds: 15
  periodSeconds: 20
# =====================================
# FILE: helm/employeeprofileapp/templates/secretproviderclass.yaml
# VERSION: v6-enterprise-disposable-final
# =====================================

{{- if .Values.keyVault.enabled }}

apiVersion: secrets-store.csi.x-k8s.io/v1

kind: SecretProviderClass

metadata:

  name: {{ default "employeeprofileapp-spc" .Values.secretProviderClass.name }}

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default .Chart.Name .Values.app.name }}

spec:

  provider: azure

  # =====================================
  # KUBERNETES SECRET SYNC
  # =====================================

  secretObjects:

    - secretName: {{ default "employeeprofileapp-kv-secrets" .Values.keyVault.k8sSecretName }}

      type: Opaque

      data:

        {{- range .Values.secretProviderClass.objects }}

        - objectName: {{ .objectName }}

          key: {{ .objectName }}

        {{- end }}

  parameters:

    # =====================================
    # ENTERPRISE WORKLOAD IDENTITY
    # =====================================

    usePodIdentity: "{{ .Values.secretProviderClass.usePodIdentity }}"

    useVMManagedIdentity: "{{ .Values.secretProviderClass.useVMManagedIdentity }}"

    clientID: "{{ .Values.workloadIdentity.clientId }}"

    # =====================================
    # AZURE KEY VAULT
    # =====================================

    keyvaultName: "{{ .Values.keyVault.name }}"

    tenantId: "{{ .Values.workloadIdentity.tenantId }}"

    cloudName: "{{ .Values.keyVault.cloudName }}"

    # =====================================
    # SECRET ROTATION
    # =====================================

    enableSecretRotation: "true"

    # =====================================
    # KUBERNETES SECRET SYNC
    # =====================================

    syncSecret: "true"

    # =====================================
    # SECRETS
    # =====================================

    objects: |

      array:

        {{- range .Values.secretProviderClass.objects }}

        - |

          objectName: {{ .objectName }}

          objectType: {{ default "secret" .objectType }}

          objectVersion: ""

        {{- end }}

{{- end }}
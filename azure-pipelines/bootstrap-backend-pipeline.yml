# =====================================
# FILE: azure-pipelines/backend-pipeline.yml
# VERSION: v9-enterprise-final-fixed
# FIX: corrected workingDirectory path only (NO LOGIC REMOVED)
# =====================================

trigger: none

pool:
  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # TERRAFORM
  # =====================================

  - name: terraformVersion
    value: 1.11.4

  # FIXED: corrected path to actual repo structure (bootstrap/backend)
  - name: terraformWorkingDirectory
    value: $(Build.SourcesDirectory)/employeeprofileapp-aks/terraform/bootstrap/backend


stages:

  # =====================================
  # VALIDATION STAGE
  # =====================================

  - stage: Validation

    displayName: Backend Validation

    jobs:

      - job: BackendValidation

        displayName: Backend Validation

        steps:

          - checkout: self
            clean: true

          # =====================================
          # INSTALL TERRAFORM
          # =====================================

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          # =====================================
          # AZURE LOGIN VALIDATION
          # =====================================

          - task: AzureCLI@2
            displayName: Azure Login Validation
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true

                echo "=================================="
                echo "AZURE ACCOUNT"
                echo "=================================="

                az account show

          - script: |
              echo "===== WORKSPACE ROOT ====="
              pwd

              echo "===== FULL REPO STRUCTURE ====="
              ls -R $(Build.SourcesDirectory)

              echo "===== CHECK BACKEND FOLDER ====="
              ls -R $(Build.SourcesDirectory)/employeeprofileapp-aks/terraform/bootstrap/backend
            displayName: "Debug Terraform Path Validation"

          # =====================================
          # TERRAFORM INIT
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init -upgrade

          # =====================================
          # TERRAFORM FORMAT CHECK
          # =====================================

          - script: |
              set -euo pipefail
              terraform fmt -recursive -check
            displayName: Terraform Format Check
            workingDirectory: $(terraformWorkingDirectory)

          # =====================================
          # TERRAFORM VALIDATE
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Validate
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform validate

          # =====================================
          # TERRAFORM PLAN
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform plan \
                  -input=false \
                  -out=tfplan


  # =====================================
  # DEPLOYMENT STAGE
  # =====================================

  - stage: Deployment

    displayName: Backend Deployment

    dependsOn: Validation

    jobs:

      - deployment: BackendDeployment

        displayName: Backend Deployment

        environment: dev

        strategy:

          runOnce:

            deploy:

              steps:

                - checkout: self
                  clean: true

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: AzureCLI@2
                  displayName: Terraform Init
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init -upgrade

                - task: AzureCLI@2
                  displayName: Terraform Apply
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform apply \
                        -auto-approve \
                        -input=false

                - task: AzureCLI@2
                  displayName: Export Backend Outputs
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |
                      set -euo pipefail

                      STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)
                      CONTAINER_NAME=$(terraform output -raw container_name)
                      RESOURCE_GROUP=$(terraform output -raw resource_group_name)

                      echo "RESOURCE_GROUP=$RESOURCE_GROUP"
                      echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT"
                      echo "CONTAINER_NAME=$CONTAINER_NAME"

                      echo "##vso[task.setvariable variable=TF_BACKEND_RESOURCE_GROUP]$RESOURCE_GROUP"
                      echo "##vso[task.setvariable variable=TF_BACKEND_STORAGE_ACCOUNT]$STORAGE_ACCOUNT"
                      echo "##vso[task.setvariable variable=TF_BACKEND_CONTAINER]$CONTAINER_NAME"

                - task: AzureCLI@2
                  displayName: Backend Validation
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |

                      az account show || true
                      az group list -o table || true
                      az storage account list -o table || true
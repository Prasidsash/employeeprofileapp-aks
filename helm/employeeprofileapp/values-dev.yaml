replicaCount: 1

app:
  name: employeeprofileapp-dev

image:
  repository: prasidsash/employeeprofileapp-aks
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: Development

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "200m"
    memory: "256Mi"

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: Prefix

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  averageUtilization: 70

# =====================================
# Optional Future Deployment Features
# =====================================
# Existing working deployment behavior remains unchanged.

namespace: employeeprofileapp-dev

imagePullSecrets: []

readinessProbe:
  enabled: false
  path: /
  port: 8080

livenessProbe:
  enabled: false
  path: /
  port: 8080

serviceSettings:
  enableLoadBalancer: true
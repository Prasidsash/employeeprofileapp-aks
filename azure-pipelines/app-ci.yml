name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - src/**
      - helm/**
      - Dockerfile
      - azure-pipelines/app-ci.yml

    exclude:
      - terraform/**
      - azure-pipelines/infra-pipeline.yml
      - README.md

pool:
  vmImage: ubuntu-latest

# =====================================
# VARIABLES
# =====================================

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # DOCKER HUB CONFIGURATION
  # =====================================

  - name: dockerRegistryServiceConnection
    value: 'Docker-SC'

  - name: imageRepository
    value: 'prasidsash/employeeprofileapp-aks'

  # =====================================
  # OPTIONAL ACR SUPPORT
  # =====================================

  - name: enableAcr
    value: 'false'

  - name: acrServiceConnection
    value: 'ACR-SC'

  - name: acrRepository
    value: ''

  # =====================================
  # FINAL REPOSITORY RESOLUTION
  # =====================================

  - name: finalImageRepository
    value: $[eq(variables['enableAcr'], 'true') ? variables['acrRepository'] : variables['imageRepository']]

  - name: finalContainerRegistryServiceConnection
    value: $[eq(variables['enableAcr'], 'true') ? variables['acrServiceConnection'] : variables['dockerRegistryServiceConnection']]

# =====================================
# STAGES
# =====================================

stages:

  # =====================================
  # BUILD + DEVSECOPS STAGE
  # =====================================

  - stage: BuildAndSecurityScan

    displayName: Build Scan And Push

    jobs:

      - job: DockerBuildScanPush

        displayName: Docker Build Scan Push

        steps:

          - checkout: self

          # =====================================
          # TOOLING VALIDATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Docker Version"
              echo "=================================="

              docker --version

            displayName: Validate Docker Tooling

          # =====================================
          # BUILD INFORMATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Build Information"
              echo "=================================="

              echo "Repository: $(finalImageRepository)"
              echo "Build Number: $(Build.BuildNumber)"
              echo "Source Branch: $(Build.SourceBranchName)"
              echo "ACR Enabled: $(enableAcr)"

            displayName: Build Metadata

          # =====================================
          # .NET RESTORE
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Restore

            inputs:
              command: restore
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'

          # =====================================
          # .NET BUILD
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Build

            inputs:
              command: build
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'
              arguments: '--configuration Release'

          # =====================================
          # .NET TEST
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Test

            inputs:
              command: test
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'
              arguments: '--configuration Release'

          # =====================================
          # DOCKER BUILD
          # =====================================

          - task: Docker@2

            displayName: Docker Build

            inputs:
              command: build
              repository: $(finalImageRepository)
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildNumber)
                latest

          # =====================================
          # INSTALL TRIVY
          # =====================================

          - script: |

              echo "=================================="
              echo "Install Trivy"
              echo "=================================="

              sudo apt-get update

              sudo apt-get install wget apt-transport-https gnupg lsb-release -y

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

              echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list

              sudo apt-get update

              sudo apt-get install trivy -y

              trivy --version

            displayName: Install Trivy

          # =====================================
          # FILE SYSTEM SCAN
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy Filesystem Scan"
              echo "=================================="

              trivy fs \
                --scanners vuln \
                --ignore-unfixed \
                --ignorefile .trivyignore \
                --exit-code 0 \
                --severity CRITICAL \
                .

            displayName: Trivy Filesystem Scan

          # =====================================
          # IMAGE SCAN
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy Docker Image Scan"
              echo "=================================="

              trivy image \
                --scanners vuln \
                --ignore-unfixed \
                --ignorefile .trivyignore \
                --exit-code 1 \
                --severity CRITICAL \
                $(finalImageRepository):$(Build.BuildNumber)

            displayName: Trivy Image Scan

          # =====================================
          # REGISTRY LOGIN
          # =====================================

          - task: Docker@2

            displayName: Registry Login

            inputs:
              command: login
              containerRegistry: $(finalContainerRegistryServiceConnection)

          # =====================================
          # DOCKER PUSH
          # =====================================

          - task: Docker@2

            displayName: Docker Push

            inputs:
              command: push
              containerRegistry: $(finalContainerRegistryServiceConnection)
              repository: $(finalImageRepository)
              tags: |
                $(Build.BuildNumber)
                latest
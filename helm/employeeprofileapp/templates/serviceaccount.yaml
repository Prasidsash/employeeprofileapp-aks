# =====================================
# FILE:
# helm/employeeprofileapp/templates/serviceaccount.yaml
# VERSION:
# v15-enterprise-workloadidentity-runtime-corrected-final
# =====================================

{{- if .Values.serviceAccount.create }}

apiVersion: v1

kind: ServiceAccount

metadata:

  name: {{ .Values.serviceAccount.name }}

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default .Chart.Name .Values.app.name }}

    app.kubernetes.io/name: {{ .Chart.Name }}

    app.kubernetes.io/instance: {{ .Release.Name }}

    app.kubernetes.io/managed-by: Helm

    managed-by: Helm

    {{- if .Values.podLabels }}

{{ toYaml .Values.podLabels | indent 4 }}

    {{- end }}

  annotations:

    # =====================================
    # WORKLOAD IDENTITY ENABLEMENT
    # =====================================

    {{- if .Values.workloadIdentity.enabled }}

    azure.workload.identity/use: "true"

    {{- end }}

    # =====================================
    # AZURE CLIENT ID
    # =====================================

    {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.clientId }}

    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}

    {{- end }}

    # =====================================
    # TENANT ID
    # =====================================

    {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.tenantId }}

    azure.workload.identity/tenant-id: {{ .Values.workloadIdentity.tenantId | quote }}

    {{- end }}

    # =====================================
    # ADDITIONAL USER ANNOTATIONS
    # =====================================

    {{- with .Values.serviceAccount.annotations }}

{{ toYaml . | indent 4 }}

    {{- end }}

automountServiceAccountToken: true

{{- end }}
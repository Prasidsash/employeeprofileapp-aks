apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ default "employeeprofileapp" .Values.app.name }}

  labels:
    app: {{ default .Chart.Name .Values.app.name }}

  annotations:
    checksum/config: {{ .Values.app.name | sha256sum }}

spec:

  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ default .Chart.Name .Values.app.name }}

  template:

    metadata:

      labels:
        app: {{ default .Chart.Name .Values.app.name }}

      {{- if .Values.podAnnotations }}
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
      {{- end }}

    spec:

      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}

      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}

      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}

      containers:

        - name: {{ default .Chart.Name .Values.app.name }}

          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ default "latest" .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          {{- if .Values.securityContext }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          {{- end }}

          ports:

            - containerPort: {{ .Values.service.targetPort }}

          {{- if .Values.env }}
          env:

            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}

          {{- end }}

          {{- if and .Values.readinessProbe .Values.readinessProbe.enabled }}
          readinessProbe:

            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}

            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}

            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}

          {{- end }}

          {{- if and .Values.livenessProbe .Values.livenessProbe.enabled }}
          livenessProbe:

            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}

            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}

            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}

          {{- end }}

          resources:

            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}

            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
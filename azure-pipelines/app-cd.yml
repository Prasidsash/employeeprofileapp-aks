trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

# =====================================
# GLOBAL VARIABLES
# =====================================

variables:

  dockerRegistryServiceConnection: 'Docker-SC'

  kubernetesServiceConnection: 'AKS SCN'

  imageRepository: 'prasidsash/employeeprofileapp-aks'

  imagePullSecret: 'dockerhub-secret'

  helmChartPath: 'helm/employeeprofileapp'

# =====================================
# STAGES
# =====================================

stages:

# =====================================
# DEV DEPLOYMENT
# =====================================

- stage: DEV

  displayName: DEV Deployment

  jobs:

    - deployment: DeployDEV

      displayName: Deploy DEV

      environment: employeeprofileapp-dev

      strategy:

        runOnce:

          deploy:

            steps:

              - checkout: self

              # =========================
              # AKS LOGIN
              # =========================

              - task: Kubernetes@1

                displayName: Get DEV AKS Credentials

                inputs:

                  connectionType: Kubernetes Service Connection

                  kubernetesServiceEndpoint: $(kubernetesServiceConnection)

                  command: login

              # =========================
              # IMAGE PULL SECRET
              # =========================

              - task: KubernetesManifest@1

                displayName: Create DEV Image Pull Secret

                inputs:

                  action: createSecret

                  secretName: $(imagePullSecret)

                  dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

                  namespace: employeeprofileapp-dev

              # =========================
              # HELM DEPLOY
              # =========================

              - task: HelmDeploy@0

                displayName: Deploy DEV Helm Chart

                inputs:

                  connectionType: Kubernetes Service Connection

                  kubernetesServiceConnection: $(kubernetesServiceConnection)

                  namespace: employeeprofileapp-dev

                  command: upgrade

                  chartType: FilePath

                  chartPath: $(helmChartPath)

                  releaseName: employeeprofileapp-dev

                  install: true

                  valueFile: helm/employeeprofileapp/values-dev.yaml

                  arguments: >
                    --set image.repository=$(imageRepository)
                    --set image.tag=$(Build.BuildId)

# =====================================
# QA DEPLOYMENT
# =====================================


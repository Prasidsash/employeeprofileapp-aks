resources:
  pipelines:
    - pipeline: ciPipeline   # local alias, can be any name
      source: CI   # must match the CI pipeline name in Azure DevOps
      trigger: true

pool:
  vmImage: ubuntu-latest

# =====================================
# GLOBAL VARIABLES
# =====================================

variables:

  dockerRegistryServiceConnection: 'Docker-SC'

  azureServiceConnection: 'AzureAKS-SCN'

  imageRepository: 'prasidsash/employeeprofileapp-aks'

  imagePullSecret: 'dockerhub-secret'

  helmChartPath: 'helm/employeeprofileapp'

# =====================================
# STAGES
# =====================================

stages:

# =====================================
# DEV DEPLOYMENT
# =====================================

- stage: DEV

  displayName: DEV Deployment

  variables:

    aksResourceGroup: employeeprofileapp-dev-rg

    aksClusterName: employeeprofileapp-dev-aks

    namespace: employeeprofileapp-dev

    helmReleaseName: employeeprofileapp-dev

    valuesFile: helm/employeeprofileapp/values-dev.yaml

  jobs:

    - deployment: DeployDEV

      displayName: Deploy DEV

      environment: employeeprofileapp-dev

      strategy:

        runOnce:

          deploy:

            steps:

              - checkout: self

              # =========================
              # IMAGE PULL SECRET
              # =========================

              - task: KubernetesManifest@1

                displayName: Create DEV Image Pull Secret

                inputs:

                  action: createSecret

                  connectionType: azureResourceManager

                  azureSubscriptionConnection: $(azureServiceConnection)

                  azureResourceGroup: $(aksResourceGroup)

                  kubernetesCluster: $(aksClusterName)

                  namespace: $(namespace)

                  secretName: $(imagePullSecret)

                  dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

              # =========================
              # HELM DEPLOY
              # =========================

              - task: HelmDeploy@0

                displayName: Deploy DEV Helm Chart

                inputs:

                  connectionType: Azure Resource Manager

                  azureSubscription: $(azureServiceConnection)

                  azureResourceGroup: $(aksResourceGroup)

                  kubernetesCluster: $(aksClusterName)

                  namespace: $(namespace)

                  command: upgrade

                  chartType: FilePath

                  chartPath: $(helmChartPath)

                  releaseName: $(helmReleaseName)

                  install: true

                  valueFile: $(valuesFile)

                  arguments: >
                    --set image.repository=$(imageRepository)
                    --set image.tag=$(resources.pipeline.ciPipeline.runName)

# =====================================
# QA DEPLOYMENT
# =====================================

- stage: QA

  displayName: QA Deployment


name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - src/**
      - helm/**
      - Dockerfile
      - azure-pipelines/app-ci.yml

    exclude:
      - terraform/**
      - azure-pipelines/infra-pipeline.yml
      - README.md

pool:
  vmImage: ubuntu-latest

# =====================================
# VARIABLES
# =====================================

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # DOCKER HUB CONFIGURATION
  # =====================================

  - name: dockerRegistryServiceConnection
    value: 'Docker-SC'

  - name: imageRepository
    value: 'prasidsash/employeeprofileapp-aks'

  # =====================================
  # OPTIONAL ACR SUPPORT
  # =====================================

  - name: enableAcr
    value: 'true'

  - name: acrServiceConnection
    value: 'ACR-SC'

  - name: acrRepository
    value: 'empprofacr2026.azurecr.io/employeeprofileapp-aks'

# =====================================
# STAGES
# =====================================

stages:

  - stage: BuildAndSecurityScan

    displayName: Build Scan And Push

    jobs:

      - job: DockerBuildScanPush

        displayName: Docker Build Scan Push

        steps:

          - checkout: self

          # =====================================
          # TOOLING VALIDATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Docker Version"
              echo "=================================="

              docker --version

            displayName: Validate Docker Tooling

          # =====================================
          # BUILD INFORMATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Build Information"
              echo "=================================="

              echo "Build Number: $(Build.BuildNumber)"
              echo "Source Branch: $(Build.SourceBranchName)"
              echo "ACR Enabled: $(enableAcr)"

            displayName: Build Metadata

          # =====================================
          # .NET RESTORE
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Restore

            inputs:
              command: restore
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'

          # =====================================
          # .NET BUILD
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Build

            inputs:
              command: build
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'
              arguments: '--configuration Release'

          # =====================================
          # .NET TEST
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Test

            inputs:
              command: test
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'
              arguments: '--configuration Release'

          # =====================================
          # INSTALL TRIVY
          # =====================================

          - script: |

              echo "=================================="
              echo "Install Trivy"
              echo "=================================="

              sudo apt-get update

              sudo apt-get install wget apt-transport-https gnupg lsb-release -y

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

              echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list

              sudo apt-get update

              sudo apt-get install trivy -y

              trivy --version

            displayName: Install Trivy

          # =====================================
          # FILE SYSTEM SCAN
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy Filesystem Scan"
              echo "=================================="

              trivy fs \
                --scanners vuln \
                --ignore-unfixed \
                --ignorefile .trivyignore \
                --exit-code 0 \
                --severity CRITICAL \
                .

            displayName: Trivy Filesystem Scan

          # =====================================
          # DOCKER HUB BUILD AND PUSH
          # =====================================

          - task: Docker@2

            displayName: Docker Hub Build And Push

            condition: eq(variables['enableAcr'], 'false')

            inputs:
              command: buildAndPush
              containerRegistry: 'Docker-SC'
              repository: $(imageRepository)
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildNumber)
                latest

          # =====================================
          # ACR BUILD AND PUSH
          # =====================================

          - task: Docker@2

            displayName: ACR Build And Push

            condition: eq(variables['enableAcr'], 'true')

            inputs:
              command: buildAndPush
              containerRegistry: 'ACR-SC'
              repository: $(acrRepository)
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildNumber)
                latest

          # =====================================
          # TRIVY IMAGE SCAN - DOCKER HUB
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy Docker Hub Image Scan"
              echo "=================================="

              trivy image \
                --scanners vuln \
                --ignore-unfixed \
                --ignorefile .trivyignore \
                --exit-code 1 \
                --severity CRITICAL \
                $(imageRepository):$(Build.BuildNumber)

            displayName: Trivy Docker Hub Image Scan

            condition: eq(variables['enableAcr'], 'false')

                    # =====================================
          # ACR LOGIN FOR TRIVY
          # =====================================

          - task: Docker@2

            displayName: ACR Login For Trivy

            condition: eq(variables['enableAcr'], 'true')

            inputs:
              command: login
              containerRegistry: 'ACR-SC'

          # =====================================
          # TRIVY IMAGE SCAN - ACR
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy ACR Image Scan"
              echo "=================================="

              docker pull $(acrRepository):$(Build.BuildNumber)

              trivy image \
                --scanners vuln \
                --ignore-unfixed \
                --ignorefile .trivyignore \
                --exit-code 1 \
                --severity CRITICAL \
                $(acrRepository):$(Build.BuildNumber)

            displayName: Trivy ACR Image Scan

            condition: eq(variables['enableAcr'], 'true')
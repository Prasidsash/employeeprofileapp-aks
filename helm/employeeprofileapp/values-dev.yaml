# =====================================
# FILE:
# helm/employeeprofileapp/values-dev.yaml
# VERSION:
# v21-enterprise-workloadidentity-dev-complete-final
# =====================================

replicaCount: 1

revisionHistoryLimit: 3

terminationGracePeriodSeconds: 30

runtimeClassName: ""

priorityClassName: ""

dnsPolicy: ClusterFirst

dnsConfig: {}

hostAliases: []

namespaceOverride: employeeprofileapp-dev

# =====================================
# APPLICATION
# =====================================

app:
  name: employeeprofileapp

# =====================================
# IMAGE
# =====================================

image:
  repository: empprofacr2027.azurecr.io/employeeprofileapp-aks
  tag: latest
  pullPolicy: Always

# =====================================
# OPTIONAL ACR SETTINGS
# =====================================

acr:
  enabled: true

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets: []

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:
  create: true
  name: employee-sa

  annotations: {}

# =====================================
# WORKLOAD IDENTITY
# =====================================

workloadIdentity:
  enabled: true

  clientId: ""

  tenantId: ""

# =====================================
# SERVICE
# =====================================

service:
  type: ClusterIP

  port: 80

  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# OPTIONAL SERVICE SETTINGS
# =====================================

serviceSettings:
  enableLoadBalancer: false

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

# =====================================
# INGRESS
# =====================================

ingress:
  enabled: true

  className: nginx

  host: dev.employee.local

  path: /employeeprofileapp-dev-release

  pathType: Prefix

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  tls:
    enabled: false
    secretName: ""

# =====================================
# HPA
# =====================================

hpa:
  enabled: false

  minReplicas: 1

  maxReplicas: 2

  averageUtilization: 70

  memoryAverageUtilization: 80

  stabilizationWindowSeconds: 300

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:
  ASPNETCORE_ENVIRONMENT: Development

  ASPNETCORE_URLS: http://+:8080

  extraEnv: []

# =====================================
# ENV FROM
# =====================================

envFrom: []

# =====================================
# ENV FROM SECRET
# =====================================

envFromSecrets:
  enabled: true

  secretName: employeeprofileapp-kv-secret

# =====================================
# AZURE KEY VAULT
# =====================================

keyVault:
  enabled: true

  secretProviderClass: employeeprofileapp-spc

  k8sSecretName: employeeprofileapp-kv-secret

  mountPath: /mnt/secrets-store

  tenantId: ""

  keyVaultName: ""

  cloudName: AzurePublicCloud

  objects:
    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

    - objectName: sql-server-name
      objectType: secret

    - objectName: sql-server-fqdn
      objectType: secret

    - objectName: sql-database-name
      objectType: secret

    - objectName: sql-connection-string
      objectType: secret

# =====================================
# SECRET PROVIDER CLASS
# =====================================

secretProviderClass:
  enabled: true

  objects:
    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

    - objectName: sql-server-name
      objectType: secret

    - objectName: sql-server-fqdn
      objectType: secret

    - objectName: sql-database-name
      objectType: secret

    - objectName: sql-connection-string
      objectType: secret

# =====================================
# POD LABELS
# =====================================

podLabels:
  app: employeeprofileapp

extraPodLabels: {}

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations:
  azure.workload.identity/use: "true"

extraPodAnnotations: {}

# =====================================
# NODE SELECTOR
# =====================================

nodeSelector: {}

# =====================================
# TOLERATIONS
# =====================================

tolerations: []

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# TOPOLOGY SPREAD CONSTRAINTS
# =====================================

topologySpreadConstraints: []

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext:
  allowPrivilegeEscalation: false

  readOnlyRootFilesystem: false

  runAsNonRoot: true

  runAsUser: 1000

  capabilities:
    drop:
      - ALL

# =====================================
# POD SECURITY CONTEXT
# =====================================

podSecurityContext:
  runAsNonRoot: true

  runAsUser: 1000

  fsGroup: 2000

  seccompProfile:
    type: RuntimeDefault

# =====================================
# CONTAINER PORTS
# =====================================

containerPorts:
  http: 8080
  https: 8443

# =====================================
# PROBES
# =====================================

readinessProbe:
  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  successThreshold: 1

  failureThreshold: 3

livenessProbe:
  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 15

  periodSeconds: 20

  timeoutSeconds: 5

  successThreshold: 1

  failureThreshold: 5

startupProbe:
  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  successThreshold: 1

  failureThreshold: 30

# =====================================
# CONFIGMAP AUTO RELOAD
# =====================================

configMapAutoReload:
  enabled: false

# =====================================
# NETWORK POLICY
# =====================================

networkPolicy:
  enabled: false

  ingressControllerNamespace: ingress-nginx

# =====================================
# SECRET MOUNTS
# =====================================

secretMounts:
  enabled: true

  mountPath: /mnt/secrets-store

  readOnly: true

# =====================================
# INIT CONTAINERS
# =====================================

initContainers: []

# =====================================
# EXTRA VOLUMES
# =====================================

extraVolumes: []

# =====================================
# EXTRA VOLUME MOUNTS
# =====================================

extraVolumeMounts: []

# =====================================
# SIDECARS
# =====================================

sidecars: []

# =====================================
# LIFECYCLE
# =====================================

lifecycle: {}

# =====================================
# SERVICE MONITOR
# =====================================

serviceMonitor:
  enabled: false

  interval: 30s

  scrapeTimeout: 10s

  labels: {}

# =====================================
# PDB
# =====================================

podDisruptionBudget:
  enabled: false

  minAvailable: 1

# =====================================
# LOGGING
# =====================================

logging:
  enabled: true

# =====================================
# METRICS
# =====================================

metrics:
  enabled: false

# =====================================
# TESTS
# =====================================

tests:
  enabled: false

# =====================================
# STRATEGY
# =====================================

strategy:
  type: RollingUpdate

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
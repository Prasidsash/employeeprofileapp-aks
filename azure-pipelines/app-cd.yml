# =====================================
# FILE:
# azure-pipelines/app-cd.yml
# VERSION:
# v25-enterprise-workloadidentity-keyvault-runtime-complete-final
# =====================================

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: employeeprofileapp-dev-vars

  - name: namespace
    value: employeeprofileapp-dev

  - name: helmReleaseName
    value: employeeprofileapp-dev-release

  - name: helmChartPath
    value: helm/employeeprofileapp

  - name: deploymentName
    value: employeeprofileapp

  - name: imageRepository
    value: employeeprofileapp-aks

  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: Deploy

    displayName: Deploy EmployeeProfileApp

    jobs:
      - job: HelmDeploy

        displayName: Helm Upgrade Install

        steps:
          - checkout: self

          # =====================================
          # AKS LOGIN
          # =====================================

          - task: AzureCLI@2

            displayName: AKS Get Credentials

            inputs:
              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                az aks get-credentials \
                  --resource-group $(aksResourceGroup) \
                  --name $(aksClusterName) \
                  --overwrite-existing

          # =====================================
          # HELM DEPLOYMENT
          # =====================================

          - task: AzureCLI@2

            displayName: Helm Upgrade Install

            inputs:
              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                echo "=================================="
                echo "VALIDATE VARIABLES"
                echo "=================================="

                if [ -z "$(WORKLOAD_CLIENT_ID)" ]; then
                  echo "ERROR: WORKLOAD_CLIENT_ID is empty"
                  exit 1
                fi

                if [ -z "$(AZURE_TENANT_ID)" ]; then
                  echo "ERROR: AZURE_TENANT_ID is empty"
                  exit 1
                fi

                if [ -z "$(KEYVAULT_NAME)" ]; then
                  echo "ERROR: KEYVAULT_NAME is empty"
                  exit 1
                fi

                echo "=================================="
                echo "VARIABLE VALUES"
                echo "=================================="

                echo "WORKLOAD_CLIENT_ID=$(WORKLOAD_CLIENT_ID)"
                echo "AZURE_TENANT_ID=$(AZURE_TENANT_ID)"
                echo "KEYVAULT_NAME=$(KEYVAULT_NAME)"

                echo "=================================="
                echo "ACR LOGIN SERVER"
                echo "=================================="

                ACR_LOGIN_SERVER=$(az acr show \
                  --name $(acrName) \
                  --query loginServer \
                  --output tsv)

                echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}"

                echo "=================================="
                echo "HELM DEPENDENCY UPDATE"
                echo "=================================="

                helm dependency update $(helmChartPath)

                echo "=================================="
                echo "REMOVE EXISTING SERVICE ACCOUNT"
                echo "=================================="

                kubectl delete sa employee-sa \
                  -n $(namespace) \
                  --ignore-not-found=true

                echo "=================================="
                echo "HELM TEMPLATE VALIDATION"
                echo "=================================="

                helm template \
                  $(helmReleaseName) \
                  $(helmChartPath) \
                  --namespace $(namespace) \
                  --values $(helmChartPath)/values.yaml \
                  --values $(helmChartPath)/values-dev.yaml \
                  --set image.repository="${ACR_LOGIN_SERVER}/$(imageRepository)" \
                  --set image.tag="$(imageTag)" \
                  --set workloadIdentity.enabled=true \
                  --set-string workloadIdentity.clientId="$(WORKLOAD_CLIENT_ID)" \
                  --set-string keyVault.tenantId="$(AZURE_TENANT_ID)" \
                  --set-string keyVault.keyVaultName="$(KEYVAULT_NAME)" \
                  --set keyVault.enabled=true \
                  > /tmp/rendered-manifest.yaml

                echo "=================================="
                echo "VERIFY WORKLOAD IDENTITY"
                echo "=================================="

                CLIENT_ID_COUNT=$(grep -c 'azure.workload.identity/client-id:' /tmp/rendered-manifest.yaml || true)

                if [ "${CLIENT_ID_COUNT}" -gt 1 ]; then
                  echo "ERROR: duplicate workload identity annotation found"
                  exit 1
                fi

                echo "=================================="
                echo "HELM UPGRADE INSTALL"
                echo "=================================="

                helm upgrade --install \
                  $(helmReleaseName) \
                  $(helmChartPath) \
                  --namespace $(namespace) \
                  --create-namespace \
                  --values $(helmChartPath)/values.yaml \
                  --values $(helmChartPath)/values-dev.yaml \
                  --set image.repository="${ACR_LOGIN_SERVER}/$(imageRepository)" \
                  --set image.tag="$(imageTag)" \
                  --set workloadIdentity.enabled=true \
                  --set-string workloadIdentity.clientId="$(WORKLOAD_CLIENT_ID)" \
                  --set-string keyVault.tenantId="$(AZURE_TENANT_ID)" \
                  --set-string keyVault.keyVaultName="$(KEYVAULT_NAME)" \
                  --set keyVault.enabled=true \
                  --wait \
                  --timeout 15m

                echo "=================================="
                echo "ROLLING RESTART"
                echo "=================================="

                kubectl rollout restart deployment $(deploymentName) \
                  -n $(namespace)

                echo "=================================="
                echo "ROLLOUT STATUS"
                echo "=================================="

                kubectl rollout status deployment $(deploymentName) \
                  -n $(namespace) \
                  --timeout=900s

          # =====================================
          # POD STATUS
          # =====================================

          - task: AzureCLI@2

            displayName: Verify Pods

            inputs:
              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                set -euo pipefail

                echo "=================================="
                echo "POD STATUS"
                echo "=================================="

                kubectl get pods -n $(namespace)

                echo "=================================="
                echo "DEPLOYMENT STATUS"
                echo "=================================="

                kubectl get deployment $(deploymentName) \
                  -n $(namespace)

                echo "=================================="
                echo "SERVICE STATUS"
                echo "=================================="

                kubectl get svc -n $(namespace)
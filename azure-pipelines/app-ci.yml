# =====================================
# FILE: azure-pipelines/app-ci.yml
# VERSION: v9-enterprise-disposable-final
# =====================================

trigger:

  branches:

    include:

      - main

  paths:

    include:

      - src/**
      - Dockerfile
      - azure-pipelines/app-ci.yml

pool:

  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # DOCKER
  # =====================================

  - name: imageRepository
    value: employeeprofileapp-aks

  - name: dockerfilePath
    value: Dockerfile

  - name: imageTag
    value: $(Build.BuildId)

  # =====================================
  # ACR
  # =====================================

  - name: acrName
    value: empprofacr2026

  # =====================================
  # DOTNET
  # =====================================

  - name: dotnetSdkVersion
    value: 8.0.x

stages:

  # =====================================
  # BUILD STAGE
  # =====================================

  - stage: Build

    displayName: Build Application

    jobs:

      - job: Build

        displayName: Build .NET Application

        steps:

          - checkout: self

            clean: true

          # =====================================
          # INSTALL .NET SDK
          # =====================================

          - task: UseDotNet@2

            displayName: Install .NET SDK

            inputs:

              packageType: sdk

              version: $(dotnetSdkVersion)

          # =====================================
          # RESTORE
          # =====================================

          - script: |

              set -euo pipefail

              dotnet restore src/EmployeeProfileApp/EmployeeProfileApp.csproj

            displayName: DotNet Restore

          # =====================================
          # BUILD
          # =====================================

          - script: |

              set -euo pipefail

              dotnet build \
                src/EmployeeProfileApp/EmployeeProfileApp.csproj \
                --configuration Release \
                --no-restore

            displayName: DotNet Build

          # =====================================
          # TEST
          # =====================================

          - script: |

              set -euo pipefail

              dotnet test \
                src/EmployeeProfileApp/EmployeeProfileApp.csproj \
                --configuration Release \
                --no-build \
                --verbosity normal || true

            displayName: DotNet Test

          # =====================================
          # PUBLISH
          # =====================================

          - script: |

              set -euo pipefail

              dotnet publish \
                src/EmployeeProfileApp/EmployeeProfileApp.csproj \
                --configuration Release \
                --output $(Build.ArtifactStagingDirectory)/publish

            displayName: DotNet Publish

          # =====================================
          # PUBLISH ARTIFACTS
          # =====================================

          - task: PublishBuildArtifacts@1

            displayName: Publish Build Artifacts

            inputs:

              PathtoPublish: $(Build.ArtifactStagingDirectory)/publish

              ArtifactName: drop

              publishLocation: Container

  # =====================================
  # DOCKER BUILD STAGE
  # =====================================

  - stage: Docker

    displayName: Build And Push Docker Image

    dependsOn: Build

    jobs:

      - job: DockerBuild

        displayName: Docker Build And Push

        steps:

          - checkout: self

            clean: true

          # =====================================
          # ACR LOGIN
          # =====================================

          - task: AzureCLI@2

            displayName: ACR Login

            inputs:

              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                az acr login \
                  --name $(acrName)

          # =====================================
          # DOCKER BUILD
          # =====================================

          - script: |

              set -euo pipefail

              docker build \
                -f $(dockerfilePath) \
                -t $(acrName).azurecr.io/$(imageRepository):$(imageTag) \
                -t $(acrName).azurecr.io/$(imageRepository):latest \
                .

            displayName: Docker Build

          # =====================================
          # DOCKER PUSH
          # =====================================

          - script: |

              set -euo pipefail

              docker push $(acrName).azurecr.io/$(imageRepository):$(imageTag)

              docker push $(acrName).azurecr.io/$(imageRepository):latest

            displayName: Docker Push

          # =====================================
          # IMAGE VALIDATION
          # =====================================

          - task: AzureCLI@2

            displayName: Image Validation

            inputs:

              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                az acr repository show-tags \
                  --name $(acrName) \
                  --repository $(imageRepository) \
                  --output table

          # =====================================
          # EXPORT IMAGE VARIABLES
          # =====================================

          - script: |

              echo "##vso[task.setvariable variable=IMAGE_TAG]$(imageTag)"

              echo "##vso[task.setvariable variable=IMAGE_REPOSITORY]$(imageRepository)"

            displayName: Export Image Variables

          # =====================================
          # FAILURE DIAGNOSTICS
          # =====================================

          - task: AzureCLI@2

            displayName: Failure Diagnostics

            condition: failed()

            inputs:

              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                echo "=================================="
                echo "ACR REPOSITORIES"
                echo "=================================="

                az acr repository list \
                  --name $(acrName) \
                  --output table || true

                echo "=================================="
                echo "DOCKER IMAGES"
                echo "=================================="

                docker images || true
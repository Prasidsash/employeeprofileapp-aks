apiVersion: v1
kind: Service

metadata:
  name: {{ default "employeeprofileapp" .Values.app.name }}

spec:

  {{- /*
      Existing behavior preserved:
      - If serviceSettings.enableLoadBalancer exists:
          true  -> LoadBalancer
          false -> ClusterIP
      - Otherwise fall back to current service.type
  */}}

  type: {{ if hasKey .Values "serviceSettings" }}{{ if .Values.serviceSettings.enableLoadBalancer }}LoadBalancer{{ else }}ClusterIP{{ end }}{{ else }}{{ .Values.service.type }}{{ end }}

  selector:
    app: {{ default "employeeprofileapp" .Values.app.name }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
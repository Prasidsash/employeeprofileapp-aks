# =====================================
# FILE: helm/employeeprofileapp/templates/hpa.yaml
# VERSION: v5-enterprise-disposable-final
# =====================================

{{- if and .Values.hpa .Values.hpa.enabled }}

apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: {{ default "employeeprofileapp" .Values.app.name }}-hpa

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default "employeeprofileapp" .Values.app.name }}

spec:

  minReplicas: {{ .Values.hpa.minReplicas }}

  maxReplicas: {{ .Values.hpa.maxReplicas }}

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: {{ default "employeeprofileapp" .Values.app.name }}

  metrics:

    # =====================================
    # CPU METRICS
    # =====================================

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: {{ .Values.hpa.averageUtilization }}

    # =====================================
    # MEMORY METRICS
    # =====================================

    {{- if .Values.hpa.memoryAverageUtilization }}

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization

          averageUtilization: {{ .Values.hpa.memoryAverageUtilization }}

    {{- end }}

  # =====================================
  # HPA BEHAVIOR
  # =====================================

  behavior:

    scaleUp:

      stabilizationWindowSeconds: {{ .Values.hpa.stabilizationWindowSeconds | default 300 }}

      selectPolicy: Max

      policies:

        - type: Percent

          value: 100

          periodSeconds: 60

        - type: Pods

          value: 2

          periodSeconds: 60

    scaleDown:

      stabilizationWindowSeconds: {{ .Values.hpa.stabilizationWindowSeconds | default 300 }}

      selectPolicy: Max

      policies:

        - type: Percent

          value: 50

          periodSeconds: 60

        - type: Pods

          value: 1

          periodSeconds: 60

{{- end }}
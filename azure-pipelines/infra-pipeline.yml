# =====================================
# FILE: azure-pipelines/infra-pipeline.yml
# VERSION: v23-enterprise-keyvault-generated-sql-credentials-final
# =====================================

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - terraform/infra/**
      - terraform/modules/**
      - azure-pipelines/infra-pipeline.yml

    exclude:
      - src/**
      - helm/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: employeeprofileapp-dev-vars

  # =====================================
  # TERRAFORM
  # =====================================

  - name: terraformVersion
    value: 1.11.4

  - name: terraformWorkingDirectory
    value: terraform/infra/dev

  # =====================================
  # BACKEND
  # =====================================

  - name: backendStateKey
    value: dev.terraform.tfstate

stages:

  # =====================================
  # VALIDATION STAGE
  # =====================================

  - stage: Validation
    displayName: Terraform Validation

    jobs:
      - job: TerraformValidation
        displayName: Terraform Validation

        steps:
          - checkout: self
            clean: true

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Azure Login Validation
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true

              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true

                az account show

          - script: |
              set -euo pipefail

              echo "Checking Helm installation..."
              helm version

              echo "Initializing Helm repositories..."

              helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
              helm repo add jetstack https://charts.jetstack.io --force-update
              helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update

              helm repo update

              echo "Validating repositories..."

              helm search repo ingress-nginx/ingress-nginx
              helm search repo jetstack/cert-manager
              helm search repo prometheus-community

              echo "Helm repositories initialized successfully."
            displayName: Initialize Helm Repositories

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -upgrade \
                  -reconfigure \
                  -backend-config="resource_group_name=$(tfBackendResourceGroup)" \
                  -backend-config="storage_account_name=$(tfBackendStorageAccount)" \
                  -backend-config="container_name=$(tfBackendContainer)" \
                  -backend-config="key=$(backendStateKey)" \
                  -backend-config="use_azuread_auth=true"

          - script: |
              set -euo pipefail

              terraform fmt -recursive -check
            displayName: Terraform Format Check
            workingDirectory: $(terraformWorkingDirectory)

          - task: AzureCLI@2
            displayName: Terraform Validate
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform validate

  # =====================================
  # PLAN STAGE
  # =====================================

  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validation

    jobs:
      - job: TerraformPlan
        displayName: Terraform Plan

        steps:
          - checkout: self
            clean: true

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -reconfigure \
                  -backend-config="resource_group_name=$(tfBackendResourceGroup)" \
                  -backend-config="storage_account_name=$(tfBackendStorageAccount)" \
                  -backend-config="container_name=$(tfBackendContainer)" \
                  -backend-config="key=$(backendStateKey)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |
                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform plan \
                  -out=tfplan

          - publish: $(terraformWorkingDirectory)/tfplan
            artifact: terraform-plan

  # =====================================
  # APPLY STAGE
  # =====================================

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: succeeded()

    jobs:
      - deployment: TerraformApply
        displayName: Terraform Apply
        environment: dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - download: current
                  artifact: terraform-plan

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: AzureCLI@2
                  displayName: Terraform Init
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |
                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init \
                        -reconfigure \
                        -backend-config="resource_group_name=$(tfBackendResourceGroup)" \
                        -backend-config="storage_account_name=$(tfBackendStorageAccount)" \
                        -backend-config="container_name=$(tfBackendContainer)" \
                        -backend-config="key=$(backendStateKey)" \
                        -backend-config="use_azuread_auth=true"

                - task: AzureCLI@2
                  displayName: Terraform Apply
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |
                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      cp "$(Pipeline.Workspace)/terraform-plan/tfplan" ./tfplan

                      terraform apply \
                        -auto-approve \
                        tfplan

                - task: AzureCLI@2
                  displayName: Terraform Outputs
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |
                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform output
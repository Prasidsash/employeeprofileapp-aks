trigger: none

resources:
  pipelines:
    - pipeline: appci
      source: CI

      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

stages:

# =====================================
# DEV STAGE
# =====================================

- stage: DEV
  displayName: Deploy DEV

  condition: succeeded()

  variables:
    - group: employeeprofileapp-dev-vars

  jobs:

    - deployment: DeployDEV
      displayName: Deploy To DEV AKS

      environment: DEV

      strategy:
        runOnce:

          deploy:

            steps:

              - checkout: self

              # =====================================
              # TOOLING VALIDATION
              # =====================================

              - script: |

                  echo "=================================="
                  echo "Kubectl Version"
                  echo "=================================="

                  kubectl version --client

                  echo "=================================="
                  echo "Helm Version"
                  echo "=================================="

                  helm version

                displayName: Validate Tooling

              # =====================================
              # WAIT FOR AKS
              # =====================================

              - task: AzureCLI@2
                displayName: Wait For AKS Ready

                inputs:
                  azureSubscription: $(azureDeployServiceConnection)

                  scriptType: bash

                  scriptLocation: inlineScript

                  inlineScript: |

                    az aks wait \
                      --resource-group $(aksResourceGroup) \
                      --name $(aksClusterName) \
                      --created

              # =====================================
              # GET AKS CREDENTIALS
              # =====================================

              - task: AzureCLI@2
                displayName: Get AKS Credentials

                inputs:
                  azureSubscription: $(azureServiceConnection)

                  scriptType: bash

                  scriptLocation: inlineScript

                  inlineScript: |

                    az aks get-credentials \
                      --resource-group $(aksResourceGroup) \
                      --name $(aksClusterName) \
                      --overwrite-existing

              # =====================================
              # AKS VALIDATION
              # =====================================

              - script: |

                  kubectl config current-context

                  kubectl get nodes

                  kubectl get ns

                displayName: Validate AKS Connectivity

              # =====================================
              # NAMESPACE VALIDATION
              # =====================================

              - script: |

                  kubectl get namespace employeeprofileapp-dev

                displayName: Validate Namespace

              # =====================================
              # HELM LINT
              # =====================================

              - script: |

                  helm lint helm/employeeprofileapp

                displayName: Helm Lint Validation

              # =====================================
              # HELM DEPLOYMENT
              # =====================================

              - task: HelmDeploy@0
                displayName: Helm Upgrade Install

                inputs:
                  connectionType: None

                  command: upgrade

                  chartType: FilePath

                  chartPath: helm/employeeprofileapp

                  releaseName: employeeprofileapp-dev

                  namespace: employeeprofileapp-dev

                  arguments: >
                    --install
                    --wait
                    --timeout 10m
                    --atomic
                    --debug
                    -f helm/employeeprofileapp/values-dev.yaml
                    --set image.repository=$(imageRepository)
                    --set image.tag=$(resources.pipeline.appci.runName)

              # =====================================
              # DEPLOYMENT VALIDATION
              # =====================================

              - script: |

                  kubectl get pods -n employeeprofileapp-dev

                  kubectl get svc -n employeeprofileapp-dev

                  kubectl rollout status deployment/employeeprofileapp-dev \
                    -n employeeprofileapp-dev \
                    --timeout=300s

                displayName: Validate Deployment

              # =====================================
              # OPTIONAL DIAGNOSTICS
              # =====================================

              - script: |

                  echo "=================================="
                  echo "Deployment Diagnostics"
                  echo "=================================="

                  kubectl describe deployment employeeprofileapp-dev \
                    -n employeeprofileapp-dev || true

                condition: failed()

                displayName: Optional Deployment Diagnostics


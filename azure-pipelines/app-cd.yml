# =====================================
# FILE: azure-pipelines/app-cd.yml
# VERSION: v16-enterprise-workload-identity-runtime-injection-final
# =====================================

trigger: none

pr: none

resources:

  pipelines:

    - pipeline: employeeprofileapp-ci

      source: CI

      trigger:

        branches:

          include:

            - main

pool:
  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # TERRAFORM
  # =====================================

  - name: terraformVersion
    value: 1.11.4

  - name: terraformWorkingDirectory
    value: terraform/infra/dev

  # =====================================
  # HELM
  # =====================================

  - name: helmVersion
    value: latest

  - name: helmChartPath
    value: helm/employeeprofileapp

  - name: helmReleaseName
    value: employeeprofileapp-dev-release

  - name: namespace
    value: employeeprofileapp-dev

  - name: deploymentName
    value: employeeprofileapp

  # =====================================
  # IMAGE
  # =====================================

  - name: imageRepository
    value: employeeprofileapp-aks

  - name: imageTag
    value: $(resources.pipeline.employeeprofileapp-ci.runID)

  # =====================================
  # ACR
  # =====================================

  - name: acrName
    value: empprofacr2027

  # =====================================
  # AKS
  # =====================================

  - name: aksClusterName
    value: employeeprofileapp-dev-aks

  - name: aksResourceGroup
    value: employeeprofileapp-dev-rg

  # =====================================
  # BACKEND
  # =====================================

  - name: backendResourceGroupName
    value: $(tfBackendResourceGroup)

  - name: backendStorageAccountName
    value: $(tfBackendStorageAccount)

  - name: backendContainerName
    value: $(tfBackendContainer)

  - name: backendStateKey
    value: dev.terraform.tfstate

stages:

  - stage: Deploy

    displayName: Deploy Application

    jobs:

      - deployment: HelmDeployment

        displayName: Helm Deployment

        environment: dev

        strategy:

          runOnce:

            deploy:

              steps:

                - checkout: self
                  clean: true

                # =====================================
                # INSTALL TERRAFORM
                # =====================================

                - task: TerraformInstaller@1

                  displayName: Install Terraform

                  inputs:
                    terraformVersion: $(terraformVersion)

                # =====================================
                # INSTALL HELM
                # =====================================

                - task: HelmInstaller@1

                  displayName: Install Helm

                  inputs:
                    helmVersionToInstall: $(helmVersion)

                # =====================================
                # TERRAFORM INIT
                # =====================================

                - task: AzureCLI@2

                  displayName: Terraform Init

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init \
                        -upgrade \
                        -reconfigure \
                        -backend-config="resource_group_name=$(backendResourceGroupName)" \
                        -backend-config="storage_account_name=$(backendStorageAccountName)" \
                        -backend-config="container_name=$(backendContainerName)" \
                        -backend-config="key=$(backendStateKey)" \
                        -backend-config="use_azuread_auth=true"

                # =====================================
                # EXPORT TERRAFORM OUTPUTS
                # =====================================

                - task: AzureCLI@2

                  displayName: Export Terraform Outputs

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      echo "=================================="
                      echo "EXPORT TERRAFORM OUTPUTS"
                      echo "=================================="

                      KEYVAULT_NAME=$(terraform output -raw key_vault_name)

                      WORKLOAD_CLIENT_ID=$(terraform output -raw workload_identity_client_id)

                      TENANT_ID=$(az account show --query tenantId -o tsv)

                      if [ -z "$KEYVAULT_NAME" ]; then
                        echo "ERROR: key_vault_name output is empty"
                        exit 1
                      fi

                      if [ -z "$WORKLOAD_CLIENT_ID" ]; then
                        echo "ERROR: workload_identity_client_id output is empty"
                        exit 1
                      fi

                      if [ -z "$TENANT_ID" ]; then
                        echo "ERROR: tenant_id output is empty"
                        exit 1
                      fi

                      echo "KEYVAULT_NAME=$KEYVAULT_NAME"
                      echo "WORKLOAD_CLIENT_ID=$WORKLOAD_CLIENT_ID"
                      echo "TENANT_ID=$TENANT_ID"

                      echo "##vso[task.setvariable variable=KEYVAULT_NAME]$KEYVAULT_NAME"
                      echo "##vso[task.setvariable variable=WORKLOAD_CLIENT_ID]$WORKLOAD_CLIENT_ID"
                      echo "##vso[task.setvariable variable=TENANT_ID]$TENANT_ID"

                      echo "=================================="
                      echo "TERRAFORM OUTPUT EXPORT COMPLETED"
                      echo "=================================="

                # =====================================
                # AKS LOGIN
                # =====================================

                - task: AzureCLI@2

                  displayName: AKS Login

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                      kubectl get nodes -o wide

                # =====================================
                # ACR VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: ACR Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "ACR REPOSITORIES"
                      echo "=================================="

                      az acr repository list \
                        --name $(acrName) \
                        --output table

                      echo "=================================="
                      echo "ACR IMAGE TAGS"
                      echo "=================================="

                      az acr repository show-tags \
                        --name $(acrName) \
                        --repository $(imageRepository) \
                        --output table

                # =====================================
                # HELM DEPLOYMENT
                # =====================================

                - task: AzureCLI@2

                  displayName: Helm Upgrade Install

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "VALIDATE RUNTIME VARIABLES"
                      echo "=================================="

                      if [ -z "$(WORKLOAD_CLIENT_ID)" ]; then
                        echo "ERROR: WORKLOAD_CLIENT_ID variable is empty"
                        exit 1
                      fi

                      if [ -z "$(TENANT_ID)" ]; then
                        echo "ERROR: TENANT_ID variable is empty"
                        exit 1
                      fi

                      if [ -z "$(KEYVAULT_NAME)" ]; then
                        echo "ERROR: KEYVAULT_NAME variable is empty"
                        exit 1
                      fi

                      echo "=================================="
                      echo "ACR LOGIN SERVER"
                      echo "=================================="

                      ACR_LOGIN_SERVER=$(az acr show \
                        --name $(acrName) \
                        --query loginServer \
                        --output tsv)

                      echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}"

                      echo "=================================="
                      echo "HELM DEPENDENCY UPDATE"
                      echo "=================================="

                      helm dependency update $(helmChartPath)

                      echo "=================================="
                      echo "REMOVE EXISTING SERVICE ACCOUNT"
                      echo "=================================="

                      kubectl delete sa employee-sa \
                        -n $(namespace) \
                        --ignore-not-found=true

                      echo "=================================="
                      echo "HELM TEMPLATE VALIDATION"
                      echo "=================================="

                      helm template \
                        $(helmReleaseName) \
                        $(helmChartPath) \
                        --namespace $(namespace) \
                        --values $(helmChartPath)/values.yaml \
                        --values $(helmChartPath)/values-dev.yaml \
                        --set image.repository="${ACR_LOGIN_SERVER}/$(imageRepository)" \
                        --set image.tag="$(imageTag)" \
                        --set workloadIdentity.enabled=true \
                        --set-string workloadIdentity.clientId="$(WORKLOAD_CLIENT_ID)" \
                        --set-string workloadIdentity.tenantId="$(TENANT_ID)" \
                        --set-string keyVault.name="$(KEYVAULT_NAME)" \
                        --set keyVault.enabled=true \
                        > /tmp/rendered-manifest.yaml

                      echo "=================================="
                      echo "VERIFY RENDERED TENANT ID"
                      echo "=================================="

                      grep -i "tenantId:" /tmp/rendered-manifest.yaml || true

                      if grep -q 'tenantId: ""' /tmp/rendered-manifest.yaml; then
                        echo "ERROR: tenantId rendered as empty"
                        exit 1
                      fi

                      echo "=================================="
                      echo "HELM UPGRADE INSTALL"
                      echo "=================================="

                      helm upgrade \
                        --install \
                        $(helmReleaseName) \
                        $(helmChartPath) \
                        --namespace $(namespace) \
                        --create-namespace \
                        --values $(helmChartPath)/values.yaml \
                        --values $(helmChartPath)/values-dev.yaml \
                        --set image.repository="${ACR_LOGIN_SERVER}/$(imageRepository)" \
                        --set image.tag="$(imageTag)" \
                        --set workloadIdentity.enabled=true \
                        --set-string workloadIdentity.clientId="$(WORKLOAD_CLIENT_ID)" \
                        --set-string workloadIdentity.tenantId="$(TENANT_ID)" \
                        --set-string keyVault.name="$(KEYVAULT_NAME)" \
                        --set keyVault.enabled=true \
                        --wait=false \
                        --timeout 20m \
                        --debug

                # =====================================
                # DEPLOYMENT VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Deployment Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "DEPLOYMENT STATUS"
                      echo "=================================="

                      kubectl get deployment \
                        $(deploymentName) \
                        -n $(namespace)

                      echo "=================================="
                      echo "PODS"
                      echo "=================================="

                      kubectl get pods \
                        -n $(namespace) \
                        -o wide

                      echo "=================================="
                      echo "SERVICES"
                      echo "=================================="

                      kubectl get svc \
                        -n $(namespace)
                
                # =====================================
                # ROLLOUT VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Rollout Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "AKS LOGIN"
                      echo "=================================="

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                      echo "=================================="
                      echo "DEPLOYMENTS"
                      echo "=================================="

                      kubectl get deployment \
                        -n $(namespace)

                      echo "=================================="
                      echo "REPLICASETS"
                      echo "=================================="

                      kubectl get rs \
                        -n $(namespace)

                      echo "=================================="
                      echo "PODS"
                      echo "=================================="

                      kubectl get pods \
                        -n $(namespace) \
                        -o wide

                      echo "=================================="
                      echo "POD DETAILS"
                      echo "=================================="

                      POD_NAME=$(kubectl get pods \
                        -n $(namespace) \
                        -o jsonpath='{.items[0].metadata.name}')

                      echo "POD_NAME=${POD_NAME}"

                      kubectl describe pod \
                        ${POD_NAME} \
                        -n $(namespace)

                      echo "=================================="
                      echo "POD LOGS"
                      echo "=================================="

                      kubectl logs \
                        ${POD_NAME} \
                        -n $(namespace) \
                        --all-containers=true \
                        --tail=200 || true

                      echo "=================================="
                      echo "SECRET PROVIDER CLASS"
                      echo "=================================="

                      kubectl get secretproviderclass \
                        -n $(namespace)

                      kubectl describe secretproviderclass \
                        employeeprofileapp-spc \
                        -n $(namespace) || true

                      echo "=================================="
                      echo "SERVICE ACCOUNT"
                      echo "=================================="

                      kubectl get sa \
                        employee-sa \
                        -n $(namespace) \
                        -o yaml

                      echo "=================================="
                      echo "WORKLOAD IDENTITY LABELS"
                      echo "=================================="

                      kubectl get pod \
                        ${POD_NAME} \
                        -n $(namespace) \
                        --show-labels

                      echo "=================================="
                      echo "ROLLOUT STATUS"
                      echo "=================================="

                      kubectl rollout status \
                        deployment/$(deploymentName) \
                        -n $(namespace) \
                        --timeout=900s
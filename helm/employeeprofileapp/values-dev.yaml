# =====================================
# REPLICAS
# =====================================

replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:
  name: employeeprofileapp-dev

# =====================================
# IMAGE
# =====================================

image:
  repository: prasidsash/employeeprofileapp-aks
  tag: latest
  pullPolicy: Always

# =====================================
# SERVICE
# =====================================

service:

  enabled: true

  type: LoadBalancer

  port: 80

  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# OPTIONAL SERVICE SETTINGS
# =====================================

serviceSettings:
  enableLoadBalancer: true

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:
  ASPNETCORE_ENVIRONMENT: Development

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:
    cpu: "50m"
    memory: "64Mi"

  limits:
    cpu: "100m"
    memory: "128Mi"

# =====================================
# DEV SPOT NODE CONFIGURATION
# =====================================

nodeSelector:
  workload: spot

tolerations:

  - key: "kubernetes.azure.com/scalesetpriority"

    operator: "Equal"

    value: "spot"

    effect: "NoSchedule"

# =====================================
# INGRESS
# =====================================

ingress:
  enabled: false

  className: ""

  host: ""

  path: /

  pathType: Prefix

  annotations: {}

  tls:
    enabled: false

    secretName: ""

# =====================================
# HPA
# =====================================

hpa:
  enabled: false

  minReplicas: 1

  maxReplicas: 2

  averageUtilization: 70

  memoryAverageUtilization: null

  stabilizationWindowSeconds: 300

# =====================================
# NAMESPACE
# =====================================

namespace: employeeprofileapp-dev

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets: []

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations: {}

# =====================================
# CONFIGMAP ANNOTATIONS
# =====================================

configMapAnnotations: {}

# =====================================
# OPTIONAL EXTRA CONFIGURATION
# =====================================

extraConfig: {}

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# PROBES
# =====================================

readinessProbe:
  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

livenessProbe:
  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 15

  periodSeconds: 20
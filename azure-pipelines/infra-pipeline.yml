# =====================================
# FILE: azure-pipelines/infra-pipeline.yml
# VERSION: v21-enterprise-secure-sql-final
# =====================================

trigger:

  branches:

    include:

      - main

  paths:

    include:

      - terraform/infra/**
      - terraform/modules/**
      - azure-pipelines/infra-pipeline.yml

    exclude:

      - src/**
      - helm/**

pool:

  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # TERRAFORM
  # =====================================

  - name: terraformVersion
    value: 1.11.4

  - name: terraformWorkingDirectory
    value: terraform/infra/dev

  # =====================================
  # BACKEND
  # =====================================

  - name: backendStateKey
    value: dev.terraform.tfstate

  # =====================================
  # AKS
  # =====================================

  - name: aksClusterName
    value: employeeprofileapp-dev-aks

  - name: aksResourceGroup
    value: employeeprofileapp-dev-rg

stages:

  # =====================================
  # VALIDATION STAGE
  # =====================================

  - stage: Validation

    displayName: Terraform Validation

    jobs:

      - job: TerraformValidation

        displayName: Terraform Validation

        steps:

          # =====================================
          # CHECKOUT
          # =====================================

          - checkout: self
            clean: true

          # =====================================
          # INSTALL TERRAFORM
          # =====================================

          - task: TerraformInstaller@1
            displayName: Install Terraform

            inputs:
              terraformVersion: $(terraformVersion)

          # =====================================
          # AZURE LOGIN VALIDATION
          # =====================================

          - task: AzureCLI@2
            displayName: Azure Login Validation

            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true

                az account show

          # =====================================
          # TERRAFORM INIT
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Init

            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -upgrade \
                  -reconfigure \
                  -backend-config="resource_group_name=$(tfBackendResourceGroup)" \
                  -backend-config="storage_account_name=$(tfBackendStorageAccount)" \
                  -backend-config="container_name=$(tfBackendContainer)" \
                  -backend-config="key=$(backendStateKey)" \
                  -backend-config="use_azuread_auth=true"

          # =====================================
          # TERRAFORM FORMAT CHECK
          # =====================================

          - script: |

              set -euo pipefail

              terraform fmt -recursive -check

            displayName: Terraform Format Check

            workingDirectory: $(terraformWorkingDirectory)

          # =====================================
          # TERRAFORM VALIDATE
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Validate

            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                # =====================================
                # TF VAR EXPORTS
                # =====================================

                export TF_VAR_sql_admin_username="$(sql_admin_username)"
                export TF_VAR_sql_admin_password="$(sql_admin_password)"
                export TF_VAR_db_username="$(db_username)"
                export TF_VAR_db_password="$(db_password)"

                terraform validate

          # =====================================
          # TERRAFORM PLAN
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Plan

            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)

              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                # =====================================
                # TF VAR EXPORTS
                # =====================================

                export TF_VAR_sql_admin_username="$(sql_admin_username)"
                export TF_VAR_sql_admin_password="$(sql_admin_password)"
                export TF_VAR_db_username="$(db_username)"
                export TF_VAR_db_password="$(db_password)"

                terraform plan \
                  -input=false \
                  -out=tfplan

  # =====================================
  # DEPLOYMENT STAGE
  # =====================================

  - stage: Deployment

    displayName: Terraform Deployment

    dependsOn: Validation

    jobs:

      - deployment: TerraformDeployment

        displayName: Terraform Apply

        environment: dev

        strategy:

          runOnce:

            deploy:

              steps:

                # =====================================
                # CHECKOUT
                # =====================================

                - checkout: self
                  clean: true

                # =====================================
                # INSTALL TERRAFORM
                # =====================================

                - task: TerraformInstaller@1
                  displayName: Install Terraform

                  inputs:
                    terraformVersion: $(terraformVersion)

                # =====================================
                # TERRAFORM INIT
                # =====================================

                - task: AzureCLI@2
                  displayName: Terraform Init

                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init \
                        -upgrade \
                        -reconfigure \
                        -backend-config="resource_group_name=$(tfBackendResourceGroup)" \
                        -backend-config="storage_account_name=$(tfBackendStorageAccount)" \
                        -backend-config="container_name=$(tfBackendContainer)" \
                        -backend-config="key=$(backendStateKey)" \
                        -backend-config="use_azuread_auth=true"

                # =====================================
                # TERRAFORM APPLY
                # =====================================

                - task: AzureCLI@2
                  displayName: Terraform Apply

                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      # =====================================
                      # TF VAR EXPORTS
                      # =====================================

                      export TF_VAR_sql_admin_username="$(sql_admin_username)"
                      export TF_VAR_sql_admin_password="$(sql_admin_password)"
                      export TF_VAR_db_username="$(db_username)"
                      export TF_VAR_db_password="$(db_password)"

                      terraform apply \
                        -auto-approve \
                        -input=false

                # =====================================
                # EXPORT TERRAFORM OUTPUTS
                # =====================================

                - task: AzureCLI@2
                  displayName: Export Terraform Outputs

                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      AKS_NAME=$(terraform output -raw aks_name)
                      ACR_NAME=$(terraform output -raw acr_name)
                      KEYVAULT_NAME=$(terraform output -raw key_vault_name)

                      echo "##vso[task.setvariable variable=AKS_NAME]$AKS_NAME"
                      echo "##vso[task.setvariable variable=ACR_NAME]$ACR_NAME"
                      echo "##vso[task.setvariable variable=KEYVAULT_NAME]$KEYVAULT_NAME"

                # =====================================
                # AKS LOGIN
                # =====================================

                - task: AzureCLI@2
                  displayName: AKS Login

                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                      kubectl get nodes -o wide

                # =====================================
                # AKS CSI VALIDATION
                # =====================================

                - task: AzureCLI@2
                  displayName: AKS CSI Validation

                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl get pods -A
# =====================================
# FILE:
# helm/employeeprofileapp/templates/configmap.yaml
# VERSION:
# v14-enterprise-keyvault-runtime-final
# =====================================

apiVersion: v1

kind: ConfigMap

metadata:

  name: {{ default "employeeprofileapp" .Values.app.name }}-config

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default .Chart.Name .Values.app.name }}

    managed-by: Helm

  annotations:

    {{- if .Values.configMapAnnotations }}

{{ toYaml .Values.configMapAnnotations | indent 4 }}

    {{- end }}

data:

  # =====================================
  # APPLICATION NAME
  # =====================================

  APP_NAME: "{{ default "employeeprofileapp" .Values.app.name }}"

  # =====================================
  # ASPNETCORE ENVIRONMENT
  # =====================================

  ASPNETCORE_ENVIRONMENT: "{{ .Values.env.ASPNETCORE_ENVIRONMENT }}"

  # =====================================
  # ASPNETCORE URLS
  # =====================================

  ASPNETCORE_URLS: "{{ .Values.env.ASPNETCORE_URLS }}"

  # =====================================
  # KEY VAULT NAME
  # =====================================

  KEYVAULT_NAME: "{{ .Values.keyVault.keyVaultName }}"

  # =====================================
  # KEY VAULT SECRET PROVIDER CLASS
  # =====================================

  SECRET_PROVIDER_CLASS: "{{ .Values.keyVault.secretProviderClass }}"

  # =====================================
  # WORKLOAD IDENTITY ENABLEMENT
  # =====================================

  WORKLOAD_IDENTITY_ENABLED: "{{ .Values.workloadIdentity.enabled }}"

  # =====================================
  # SQL RUNTIME CONFIGURATION
  # =====================================

  SQL_SERVER_NAME: "runtime-from-keyvault"

  SQL_DATABASE_NAME: "runtime-from-keyvault"

  SQL_CONNECTION_MODE: "keyvault-csi"

  # =====================================
  # OPTIONAL EXTRA CONFIGURATION
  # =====================================

  {{- if .Values.extraConfig }}

{{ toYaml .Values.extraConfig | indent 2 }}

  {{- end }}
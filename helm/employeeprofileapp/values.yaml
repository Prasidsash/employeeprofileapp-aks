# =====================================
# FILE:
# helm/employeeprofileapp/values.yaml
# VERSION:
# v16-enterprise-workloadidentity-runtime-corrected-final
# =====================================

replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:

  name: ""

# =====================================
# IMAGE
# =====================================

image:

  repository: ""

  tag: ""

  pullPolicy: IfNotPresent

# =====================================
# OPTIONAL ACR SETTINGS
# =====================================

acr:

  enabled: false

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:

  create: true

  name: employee-sa

  annotations: {}

# =====================================
# WORKLOAD IDENTITY
# =====================================

workloadIdentity:

  enabled: true

  clientId: ""

  tenantId: ""

# =====================================
# SERVICE
# =====================================

service:

  type: LoadBalancer

  port: 80

  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# OPTIONAL SERVICE SETTINGS
# =====================================

serviceSettings:

  enableLoadBalancer: false

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:

    cpu: ""

    memory: ""

  limits:

    cpu: ""

    memory: ""

# =====================================
# INGRESS
# =====================================

ingress:

  enabled: false

  className: ""

  host: ""

  path: /

  pathType: Prefix

  annotations: {}

  tls:

    enabled: false

    secretName: ""

# =====================================
# HPA
# =====================================

hpa:

  enabled: false

  minReplicas: 1

  maxReplicas: 1

  averageUtilization: 70

  memoryAverageUtilization: null

  stabilizationWindowSeconds: 300

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:

  ASPNETCORE_ENVIRONMENT: Development

  ASPNETCORE_URLS: http://+:8080

# =====================================
# AZURE KEY VAULT
# =====================================

keyVault:

  enabled: true

  secretProviderClass: employeeprofileapp-spc

  k8sSecretName: employeeprofileapp-kv-secret

  mountPath: /mnt/secrets-store

  tenantId: ""

  keyVaultName: ""

  cloudName: AzurePublicCloud

  objects:

    - objectName: db-username

      objectType: secret

    - objectName: db-password

      objectType: secret

    - objectName: sql-server-name

      objectType: secret

    - objectName: sql-server-fqdn

      objectType: secret

    - objectName: sql-database-name

      objectType: secret

    - objectName: sql-connection-string

      objectType: secret

# =====================================
# SECRET PROVIDER CLASS
# =====================================

secretProviderClass:

  enabled: true

  objects:

    - objectName: db-username

      objectType: secret

    - objectName: db-password

      objectType: secret

    - objectName: sql-server-name

      objectType: secret

    - objectName: sql-server-fqdn

      objectType: secret

    - objectName: sql-database-name

      objectType: secret

    - objectName: sql-connection-string

      objectType: secret

# =====================================
# ENV FROM SECRET
# =====================================

envFromSecrets:

  enabled: true

  secretName: employeeprofileapp-kv-secret

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets:

  enabled: false

  name: ""

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations:

  azure.workload.identity/use: "true"

# =====================================
# NODE SELECTOR
# =====================================

nodeSelector: {}

# =====================================
# TOLERATIONS
# =====================================

tolerations: []

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# POD SECURITY CONTEXT
# =====================================

podSecurityContext: {}

# =====================================
# PROBES
# =====================================

readinessProbe:

  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  failureThreshold: 3

livenessProbe:

  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 15

  periodSeconds: 20

  timeoutSeconds: 5

  failureThreshold: 5

startupProbe:

  enabled: false

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  failureThreshold: 30

# =====================================
# CONFIGMAP AUTO RELOAD
# =====================================

configMapAutoReload:

  enabled: false

# =====================================
# NETWORK POLICY
# =====================================

networkPolicy:

  enabled: false

  ingressControllerNamespace: ingress-nginx

# =====================================
# SECRET MOUNTS
# =====================================

secretMounts:

  enabled: true

  mountPath: /mnt/secrets-store

  readOnly: true

# =====================================
# EXTRA VOLUMES
# =====================================

extraVolumes: []

# =====================================
# EXTRA VOLUME MOUNTS
# =====================================

extraVolumeMounts: []

# =====================================
# SIDECARS
# =====================================

sidecars: []

# =====================================
# HOST ALIASES
# =====================================

hostAliases: []

# =====================================
# DNS CONFIG
# =====================================

dnsConfig: {}

dnsPolicy: ClusterFirst

# =====================================
# RUNTIME CLASS
# =====================================

runtimeClassName: ""

# =====================================
# TERMINATION
# =====================================

terminationGracePeriodSeconds: 30

# =====================================
# STRATEGY
# =====================================

strategy:

  type: RollingUpdate

  rollingUpdate:

    maxSurge: 1

    maxUnavailable: 0
replicaCount: 1

app:
  name: employeeprofileapp-uat

image:
  repository: prasidsash/employeeprofileapp-aks
  tag: v1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "200m"
    memory: "256Mi"

ingress:
  enabled: true
  className: nginx
  host: uat.employee.local
  path: /
  pathType: Prefix

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  averageUtilization: 70
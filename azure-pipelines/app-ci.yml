# =====================================
# Azure DevOps CI Pipeline
# File: azure-pipelines/app-ci.yaml
# Version: v3.0-enterprise-final
# =====================================

name: $(Date:yyyyMMdd).$(Rev:r)

# =====================================
# TRIGGER
# =====================================

trigger:

  branches:

    include:

      - main

  paths:

    include:

      - src/**

      - helm/**

      - Dockerfile

      - azure-pipelines/app-ci.yaml

    exclude:

      - terraform/**

      - azure-pipelines/infra-pipeline.yml

      - README.md

# =====================================
# AGENT POOL
# =====================================

pool:

  vmImage: ubuntu-latest

# =====================================
# VARIABLES
# =====================================

variables:

  # =====================================
  # VARIABLE GROUP
  # =====================================

  - group: employeeprofileapp-dev-vars

  # =====================================
  # ACR CONFIGURATION
  # =====================================

  - name: acrServiceConnection
    value: 'ACR-SC'

  - name: acrLoginServer
    value: 'empprofacr2027.azurecr.io'

  - name: acrRepository
    value: 'employeeprofileapp-aks'

  # =====================================
  # IMAGE NAME
  # =====================================

  - name: imageName
    value: '$(acrLoginServer)/$(acrRepository):$(Build.BuildNumber)'

  # =====================================
  # DOCKER CONFIGURATION
  # =====================================

  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'

  - name: buildContext
    value: '$(Build.SourcesDirectory)'

# =====================================
# STAGES
# =====================================

stages:

  # =====================================
  # VALIDATION STAGE
  # =====================================

  - stage: Validate

    displayName: Validate Source

    jobs:

      - job: Validation

        displayName: Validation Checks

        steps:

          - checkout: self

          # =====================================
          # DOCKER VALIDATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Docker Validation"
              echo "=================================="

              docker --version

            displayName: Validate Docker

          # =====================================
          # HELM VALIDATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Helm Validation"
              echo "=================================="

              helm lint helm/employeeprofileapp

            displayName: Helm Lint

          # =====================================
          # KUBERNETES TEMPLATE VALIDATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Helm Template Validation"
              echo "=================================="

              helm template employeeprofileapp \
                helm/employeeprofileapp \
                --values helm/employeeprofileapp/values-dev.yaml \
                > rendered-manifest.yaml

              cat rendered-manifest.yaml

            displayName: Helm Template Validation

          # =====================================
          # DOTNET RESTORE
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Restore

            inputs:

              command: restore

              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'

          # =====================================
          # DOTNET BUILD
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Build

            inputs:

              command: build

              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'

              arguments: '--configuration Release'

          # =====================================
          # DOTNET TEST
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Test

            inputs:

              command: test

              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'

              arguments: '--configuration Release'

  # =====================================
  # BUILD AND SECURITY STAGE
  # =====================================

  - stage: BuildAndScan

    displayName: Build Scan And Push

    dependsOn: Validate

    jobs:

      - job: DockerBuildScanPush

        displayName: Docker Build Scan Push

        steps:

          - checkout: self

          # =====================================
          # INSTALL TRIVY
          # =====================================

          - script: |

              echo "=================================="
              echo "Install Trivy"
              echo "=================================="

              sudo apt-get update

              sudo apt-get install wget gnupg lsb-release apt-transport-https -y

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
              gpg --dearmor | \
              sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
              sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update

              sudo apt-get install trivy -y

            displayName: Install Trivy

          # =====================================
          # ACR LOGIN
          # =====================================

          - task: Docker@2

            displayName: ACR Login

            inputs:

              command: login

              containerRegistry: $(acrServiceConnection)

          # =====================================
          # DOCKER BUILD
          # =====================================

          - script: |

              echo "=================================="
              echo "Docker Build"
              echo "=================================="

              docker build \
                -t $(imageName) \
                -f $(dockerfilePath) \
                $(buildContext)

            displayName: Docker Build

          # =====================================
          # VERIFY IMAGE EXISTS
          # =====================================

          - script: |

              echo "=================================="
              echo "Verify Docker Image"
              echo "=================================="

              docker images

              docker inspect $(imageName)

            displayName: Verify Docker Image

          # =====================================
          # TRIVY LOCAL IMAGE SCAN
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy Security Scan"
              echo "=================================="

              echo "Scanning Local Image:"
              echo "$(imageName)"

              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                --timeout 10m \
                $(imageName)

            displayName: Trivy Image Scan

          # =====================================
          # PUSH IMAGE TO ACR
          # =====================================

          - script: |

              echo "=================================="
              echo "Push Image To ACR"
              echo "=================================="

              docker push $(imageName)

              docker tag $(imageName) \
                $(acrLoginServer)/$(acrRepository):latest

              docker push \
                $(acrLoginServer)/$(acrRepository):latest

            displayName: Push Image To ACR

          # =====================================
          # VERIFY ACR PUSH
          # =====================================

          - script: |

              echo "=================================="
              echo "Verify ACR Push"
              echo "=================================="

              az acr repository show-tags \
                --name empprofacr2027 \
                --repository $(acrRepository)

            displayName: Verify ACR Push

          # =====================================
          # PIPELINE COMPLETION
          # =====================================

          - script: |

              echo "=================================="
              echo "Pipeline Completed Successfully"
              echo "=================================="

              echo "Image:"
              echo "$(imageName)"

            displayName: Pipeline Completion
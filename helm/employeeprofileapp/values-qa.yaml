# =====================================
# REPLICAS
# =====================================

replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:
  name: employeeprofileapp-qa

# =====================================
# IMAGE
# =====================================

image:
  repository: prasidsash/employeeprofileapp-aks
  tag: latest
  pullPolicy: Always

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:

  create: false

  name: employee-sa

  annotations:

    azure.workload.identity/client-id: ""

# =====================================
# SERVICE
# =====================================

service:

  enabled: true

  type: ClusterIP

  port: 80

  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:
  ASPNETCORE_ENVIRONMENT: qa

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:
    cpu: "100m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"

# =====================================
# AZURE KEY VAULT
# =====================================

keyVault:

  enabled: true

  keyVaultName: ""

  tenantId: ""

  clientId: ""

  secretProviderClass: employeeprofileapp-spc

  mountPath: "/mnt/secrets-store"

  secrets:

    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

# =====================================
# INGRESS
# =====================================

ingress:
  enabled: true

  className: nginx

  host: ""

  path: /

  pathType: Prefix

  annotations: {}

  tls:
    enabled: false

    secretName: ""

# =====================================
# HPA
# =====================================

hpa:
  enabled: true

  minReplicas: 1

  maxReplicas: 3

  averageUtilization: 70

  memoryAverageUtilization: 80

  stabilizationWindowSeconds: 300

# =====================================
# NAMESPACE
# =====================================

namespace: employeeprofileapp-qa

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets:
  - name: dockerhub-secret

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations: {}

# =====================================
# CONFIGMAP ANNOTATIONS
# =====================================

configMapAnnotations: {}

# =====================================
# OPTIONAL EXTRA CONFIGURATION
# =====================================

extraConfig: {}

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# PROBES
# =====================================

readinessProbe:
  enabled: true

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  successThreshold: 1

  failureThreshold: 3

livenessProbe:
  enabled: true

  path: /

  port: 8080

  initialDelaySeconds: 15

  periodSeconds: 20

  timeoutSeconds: 5

  failureThreshold: 3
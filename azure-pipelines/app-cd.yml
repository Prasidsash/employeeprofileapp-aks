# =====================================
# FILE: azure-pipelines/app-cd.yml
# VERSION: v13-enterprise-helm-rollout-stabilized-final
# =====================================

trigger: none

pool:
  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # TERRAFORM
  # =====================================

  - name: terraformVersion
    value: 1.11.4

  - name: terraformWorkingDirectory
    value: terraform/infra/dev

  # =====================================
  # HELM
  # =====================================

  - name: helmVersion
    value: latest

  - name: helmChartPath
    value: helm/employeeprofileapp

  - name: helmReleaseName
    value: employeeprofileapp-dev-release

  - name: namespace
    value: employeeprofileapp-dev

  - name: deploymentName
    value: employeeprofileapp

  # =====================================
  # IMAGE
  # =====================================

  - name: imageRepository
    value: employeeprofileapp-aks

  - name: imageTag
    value: latest

  # =====================================
  # ACR
  # =====================================

  - name: acrName
    value: empprofacr2026

  # =====================================
  # AKS
  # =====================================

  - name: aksClusterName
    value: employeeprofileapp-dev-aks

  - name: aksResourceGroup
    value: employeeprofileapp-dev-rg

  # =====================================
  # BACKEND
  # =====================================

  - name: backendResourceGroupName
    value: $(tfBackendResourceGroup)

  - name: backendStorageAccountName
    value: $(tfBackendStorageAccount)

  - name: backendContainerName
    value: $(tfBackendContainer)

  - name: backendStateKey
    value: dev.terraform.tfstate

stages:

  # =====================================
  # DEPLOY APPLICATION
  # =====================================

  - stage: Deploy

    displayName: Deploy Application

    jobs:

      - deployment: HelmDeployment

        displayName: Helm Deployment

        environment: dev

        strategy:

          runOnce:

            deploy:

              steps:

                - checkout: self
                  clean: true

                # =====================================
                # INSTALL TERRAFORM
                # =====================================

                - task: TerraformInstaller@1

                  displayName: Install Terraform

                  inputs:
                    terraformVersion: $(terraformVersion)

                # =====================================
                # INSTALL HELM
                # =====================================

                - task: HelmInstaller@1

                  displayName: Install Helm

                  inputs:
                    helmVersionToInstall: $(helmVersion)

                # =====================================
                # TERRAFORM INIT
                # =====================================

                - task: AzureCLI@2

                  displayName: Terraform Init

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init \
                        -upgrade \
                        -reconfigure \
                        -backend-config="resource_group_name=$(backendResourceGroupName)" \
                        -backend-config="storage_account_name=$(backendStorageAccountName)" \
                        -backend-config="container_name=$(backendContainerName)" \
                        -backend-config="key=$(backendStateKey)" \
                        -backend-config="use_azuread_auth=true"

                # =====================================
                # EXPORT TERRAFORM OUTPUTS
                # =====================================

                - task: AzureCLI@2

                  displayName: Export Terraform Outputs

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    workingDirectory: $(terraformWorkingDirectory)

                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      KEYVAULT_NAME=$(terraform output -raw key_vault_name)
                      WORKLOAD_CLIENT_ID=$(terraform output -raw workload_identity_client_id)
                      TENANT_ID=$(terraform output -raw tenant_id)

                      echo "##vso[task.setvariable variable=KEYVAULT_NAME]$KEYVAULT_NAME"
                      echo "##vso[task.setvariable variable=WORKLOAD_CLIENT_ID]$WORKLOAD_CLIENT_ID"
                      echo "##vso[task.setvariable variable=TENANT_ID]$TENANT_ID"

                # =====================================
                # AKS LOGIN
                # =====================================

                - task: AzureCLI@2

                  displayName: AKS Login

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                      kubectl get nodes -o wide

                # =====================================
                # ACR VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: ACR Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "ACR LOGIN SERVER"
                      echo "=================================="

                      ACR_LOGIN_SERVER=$(az acr show \
                        --name $(acrName) \
                        --query loginServer \
                        --output tsv)

                      echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}"

                      echo "=================================="
                      echo "VALIDATE IMAGE EXISTS"
                      echo "=================================="

                      az acr repository show-tags \
                        --name $(acrName) \
                        --repository $(imageRepository) \
                        --output table

                      IMAGE_EXISTS=$(az acr repository show-tags \
                        --name $(acrName) \
                        --repository $(imageRepository) \
                        --query "[?@=='$(imageTag)'] | length(@)" \
                        --output tsv)

                      if [ "${IMAGE_EXISTS}" = "0" ]; then
                        echo "ERROR: IMAGE TAG $(imageTag) NOT FOUND IN ACR"
                        exit 1
                      fi

                # =====================================
                # AKS ACR ACCESS VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: AKS ACR Access Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      az aks check-acr \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --acr $(acrName).azurecr.io

                # =====================================
                # NAMESPACE VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Namespace Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl create namespace $(namespace) \
                        --dry-run=client \
                        -o yaml | kubectl apply -f -

                # =====================================
                # WORKLOAD IDENTITY VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Workload Identity Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl get sa employee-sa \
                        -n $(namespace) \
                        -o yaml || true

                      az identity federated-credential list \
                        --identity-name employeeprofileapp-dev-aks-wi \
                        --resource-group $(aksResourceGroup) || true

                # =====================================
                # HELM DEPLOYMENT
                # =====================================

                - task: AzureCLI@2

                  displayName: Helm Upgrade Install

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "ACR LOGIN SERVER"
                      echo "=================================="

                      ACR_LOGIN_SERVER=$(az acr show \
                        --name $(acrName) \
                        --query loginServer \
                        --output tsv)

                      echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}"

                      echo "=================================="
                      echo "HELM DEPENDENCY UPDATE"
                      echo "=================================="

                      helm dependency update $(helmChartPath)

                      echo "=================================="
                      echo "REMOVE EXISTING SERVICE ACCOUNT"
                      echo "=================================="

                      kubectl delete sa employee-sa \
                        -n $(namespace) \
                        --ignore-not-found=true

                      echo "=================================="
                      echo "HELM TEMPLATE VALIDATION"
                      echo "=================================="

                      helm template \
                        $(helmReleaseName) \
                        $(helmChartPath) \
                        --namespace $(namespace) \
                        --values $(helmChartPath)/values.yaml \
                        --values $(helmChartPath)/values-dev.yaml \
                        --set image.repository=${ACR_LOGIN_SERVER}/$(imageRepository) \
                        --set image.tag=$(imageTag) \
                        --set workloadIdentity.enabled=true \
                        --set workloadIdentity.clientId=$(WORKLOAD_CLIENT_ID) \
                        --set workloadIdentity.tenantId=$(TENANT_ID) \
                        --set keyVault.enabled=true \
                        --set keyVault.name=$(KEYVAULT_NAME) \
                        > /tmp/rendered-manifest.yaml

                      echo "=================================="
                      echo "HELM UPGRADE INSTALL"
                      echo "=================================="

                      helm upgrade \
                        --install \
                        $(helmReleaseName) \
                        $(helmChartPath) \
                        --namespace $(namespace) \
                        --create-namespace \
                        --values $(helmChartPath)/values.yaml \
                        --values $(helmChartPath)/values-dev.yaml \
                        --set image.repository=${ACR_LOGIN_SERVER}/$(imageRepository) \
                        --set image.tag=$(imageTag) \
                        --set workloadIdentity.enabled=true \
                        --set workloadIdentity.clientId=$(WORKLOAD_CLIENT_ID) \
                        --set workloadIdentity.tenantId=$(TENANT_ID) \
                        --set keyVault.enabled=true \
                        --set keyVault.name=$(KEYVAULT_NAME) \
                        --wait=false \
                        --timeout 20m \
                        --debug

                # =====================================
                # DEPLOYMENT VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Deployment Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "DEPLOYMENT STATUS"
                      echo "=================================="

                      kubectl get deployment \
                        $(deploymentName) \
                        -n $(namespace)

                      echo "=================================="
                      echo "PODS"
                      echo "=================================="

                      kubectl get pods \
                        -n $(namespace) \
                        -o wide

                      echo "=================================="
                      echo "SERVICES"
                      echo "=================================="

                      kubectl get svc \
                        -n $(namespace)

                # =====================================
                # ROLLOUT VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Rollout Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl rollout status \
                        deployment/$(deploymentName) \
                        -n $(namespace) \
                        --timeout=1200s

                # =====================================
                # POD HEALTH VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Pod Health Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl get pods \
                        -n $(namespace)

                      kubectl describe deployment \
                        $(deploymentName) \
                        -n $(namespace)

                      kubectl describe pods \
                        -n $(namespace)

                      kubectl logs \
                        -n $(namespace) \
                        -l app=employeeprofileapp \
                        --tail=200 || true

                # =====================================
                # CSI SECRET VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: CSI Secret Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl get secretproviderclass \
                        -n $(namespace)

                      kubectl get secret \
                        -n $(namespace)

                # =====================================
                # INGRESS VALIDATION
                # =====================================

                - task: AzureCLI@2

                  displayName: Ingress Validation

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      set -euo pipefail

                      kubectl get ingress \
                        -n $(namespace)

                      kubectl get svc -A

                # =====================================
                # FAILURE DEBUG
                # =====================================

                - task: AzureCLI@2

                  displayName: Failure Diagnostics

                  condition: failed()

                  inputs:

                    azureSubscription: $(azureInfraServiceConnection)

                    scriptType: bash

                    scriptLocation: inlineScript

                    addSpnToEnvironment: true

                    inlineScript: |

                      echo "=================================="
                      echo "ALL RESOURCES"
                      echo "=================================="

                      kubectl get all -A || true

                      echo "=================================="
                      echo "EVENTS"
                      echo "=================================="

                      kubectl get events -A \
                        --sort-by=.metadata.creationTimestamp || true

                      echo "=================================="
                      echo "DESCRIBE DEPLOYMENT"
                      echo "=================================="

                      kubectl describe deployment \
                        $(deploymentName) \
                        -n $(namespace) || true

                      echo "=================================="
                      echo "DESCRIBE PODS"
                      echo "=================================="

                      kubectl describe pods \
                        -n $(namespace) || true

                      echo "=================================="
                      echo "POD LOGS"
                      echo "=================================="

                      kubectl logs \
                        -n $(namespace) \
                        -l app=employeeprofileapp \
                        --all-containers=true \
                        --tail=500 || true

                      echo "=================================="
                      echo "REPLICASETS"
                      echo "=================================="

                      kubectl get rs \
                        -n $(namespace) || true

                      echo "=================================="
                      echo "SECRET PROVIDER CLASS"
                      echo "=================================="

                      kubectl get secretproviderclass -A || true
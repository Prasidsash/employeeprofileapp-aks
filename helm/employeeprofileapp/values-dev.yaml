# =====================================
# REPLICAS
# =====================================

replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:
  name: employeeprofileapp-dev

# =====================================
# IMAGE
# =====================================

image:

  # Runtime override expected from CI/CD
  repository: ""

  # Runtime override expected from CI/CD
  tag: ""

  pullPolicy: Always

# =====================================
# OPTIONAL ACR SETTINGS
# =====================================

acr:

  enabled: false

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:

  create: false

  name: employee-sa

  annotations:

    azure.workload.identity/client-id: ""

# =====================================
# SERVICE
# =====================================

service:

  enabled: true

  type: ClusterIP

  port: 80

  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:

  ASPNETCORE_ENVIRONMENT: dev

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:
    cpu: "100m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"

# =====================================
# AZURE KEY VAULT
# =====================================

keyVault:

  enabled: true

  # Runtime override expected from CI/CD
  keyVaultName: ""

  # Runtime override expected from CI/CD
  tenantId: ""

  # Runtime override expected from CI/CD
  clientId: ""

  secretProviderClass: employeeprofileapp-spc

  mountPath: "/mnt/secrets-store"

  secrets:

    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

# =====================================
# INGRESS
# =====================================

ingress:

  enabled: true

  className: nginx

  host: ""

  path: /

  pathType: Prefix

  annotations: {}

  tls:

    enabled: false

    secretName: ""

# =====================================
# HPA
# =====================================

hpa:

  enabled: true

  minReplicas: 1

  maxReplicas: 3

  averageUtilization: 70

  memoryAverageUtilization: 80

  stabilizationWindowSeconds: 300

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets:

  enabled: false

  name: ""

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations: {}

# =====================================
# CONFIGMAP ANNOTATIONS
# =====================================

configMapAnnotations: {}

# =====================================
# CONFIGMAP AUTO RELOAD
# =====================================

configMapAutoReload:

  enabled: true

# =====================================
# NETWORK POLICY
# =====================================

networkPolicy:

  enabled: true

  ingressControllerNamespace: ingress-nginx

# =====================================
# OPTIONAL EXTRA CONFIGURATION
# =====================================

extraConfig:

  TEST_VALUE: "v1"

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# PROBES
# =====================================

readinessProbe:

  enabled: true

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  successThreshold: 1

  failureThreshold: 3

livenessProbe:

  enabled: true

  path: /

  port: 8080

  initialDelaySeconds: 15

  periodSeconds: 20

  timeoutSeconds: 5

  failureThreshold: 3
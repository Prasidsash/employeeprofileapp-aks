trigger:
  branches:
    include:
    - main

  paths:
    include:
    - terraform/**
    - pipelines/infra/**

    exclude:
    - app/**
    - helm/**
    - Dockerfile
    - pipelines/app/**
    - README.md

parameters:
- name: environment
  type: string
  default: dev

pool:
  vmImage: ubuntu-latest

variables:

- group: employeeprofileapp-${{ parameters.environment }}-vars

- name: terraformWorkingDirectory
  value: terraform/infra/${{ parameters.environment }}

- name: resourceGroupName
  value: employeeprofileapp-${{ parameters.environment }}-rg

- name: aksClusterName
  value: employeeprofileapp-${{ parameters.environment }}-aks

# =====================================
# Optional Future Terraform Versioning
# =====================================

- name: terraformVersion
  value: 1.13.2

stages:

- stage: Terraform
  displayName: Terraform Deployment

  jobs:

  - job: TerraformApply
    displayName: Terraform Apply

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform

      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Apply

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        workingDirectory: $(terraformWorkingDirectory)

        inlineScript: |

          echo "=================================="
          echo "Terraform Initialization"
          echo "=================================="

          terraform init -reconfigure

          echo "=================================="
          echo "Terraform Formatting Validation"
          echo "=================================="

          terraform fmt -check

          echo "=================================="
          echo "Terraform Validation"
          echo "=================================="

          terraform validate

          echo "=================================="
          echo "Terraform Plan"
          echo "=================================="

          terraform plan \
            -input=false \
            -out=tfplan

          echo "=================================="
          echo "Terraform Apply"
          echo "=================================="

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

          echo "=================================="
          echo "AKS Credentials"
          echo "=================================="

          az aks get-credentials \
            --resource-group $(resourceGroupName) \
            --name $(aksClusterName) \
            --admin \
            --overwrite-existing

          echo "=================================="
          echo "Cluster Validation"
          echo "=================================="

          kubectl get nodes

          # ==================================
          # Optional Future Destroy
          # ==================================
          # terraform destroy -auto-approve
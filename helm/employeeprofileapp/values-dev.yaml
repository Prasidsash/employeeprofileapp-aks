# =====================================
# REPLICAS
# =====================================

replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:

  name: employeeprofileapp-dev

# =====================================
# IMAGE
# =====================================

image:

  # Runtime override from Azure DevOps CD pipeline

  repository: "empprofacr2027.azurecr.io/employeeprofileapp-aks"

  # Runtime override from pipeline release/version

  tag: "latest"

  pullPolicy: Always

# =====================================
# OPTIONAL ACR SETTINGS
# =====================================

acr:

  enabled: true

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:

  create: true

  name: employee-sa

  annotations: {}

# =====================================
# SERVICE
# =====================================

service:

  enabled: true

  type: ClusterIP

  port: 80

  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:

  ASPNETCORE_ENVIRONMENT: dev

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:

    cpu: "100m"

    memory: "128Mi"

  limits:

    cpu: "250m"

    memory: "256Mi"

# =====================================
# AZURE KEY VAULT
# =====================================

keyVault:

  enabled: true

  # =====================================
  # AZURE KEY VAULT NAME
  # =====================================

  keyVaultName: "employeeprofileapp-devkv"

  # =====================================
  # AZURE TENANT ID
  # =====================================

  tenantId: "242264b2-609f-4466-8afa-9c028b4003d2"

  # =====================================
  # AKS KUBELET MANAGED IDENTITY
  # IMPORTANT:
  # Must match:
  # az aks show --query identityProfile.kubeletidentity.clientId
  # =====================================

  userAssignedIdentityID: "fd790a52-e4a9-4b32-8db7-5b36bd91e6fb"

  # =====================================
  # SECRET PROVIDER CLASS
  # =====================================

  secretProviderClass: employeeprofileapp-spc

  # =====================================
  # KUBERNETES SECRET SYNC
  # =====================================

  k8sSecretName: employeeprofileapp-kv-secret

  # =====================================
  # CSI DRIVER MOUNT PATH
  # =====================================

  mountPath: "/mnt/secrets-store"

  # =====================================
  # KEY VAULT SECRETS
  # MUST EXACTLY MATCH:
  # Terraform secret names
  # =====================================

  secrets:

    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

# =====================================
# INGRESS
# =====================================

ingress:

  enabled: true

  className: nginx

  host: "employeeprofileapp-dev.example.com"

  path: /

  pathType: Prefix

  annotations: {}

  tls:

    enabled: false

    secretName: ""

# =====================================
# HPA
# =====================================

hpa:

  enabled: true

  minReplicas: 1

  maxReplicas: 3

  averageUtilization: 70

  memoryAverageUtilization: 80

  stabilizationWindowSeconds: 300

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets:

  enabled: false

  name: ""

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations: {}

# =====================================
# CONFIGMAP ANNOTATIONS
# =====================================

configMapAnnotations: {}

# =====================================
# CONFIGMAP AUTO RELOAD
# =====================================

configMapAutoReload:

  enabled: true

# =====================================
# NETWORK POLICY
# =====================================

networkPolicy:

  enabled: true

  ingressControllerNamespace: ingress-nginx

# =====================================
# OPTIONAL EXTRA CONFIGURATION
# =====================================

extraConfig:

  TEST_VALUE: "v1"

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# READINESS PROBE
# =====================================

readinessProbe:

  enabled: true

  path: /

  port: 8080

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  successThreshold: 1

  failureThreshold: 3

# =====================================
# LIVENESS PROBE
# =====================================

livenessProbe:

  enabled: true

  path: /

  port: 8080

  initialDelaySeconds: 15

  periodSeconds: 20

  timeoutSeconds: 5

  failureThreshold: 3
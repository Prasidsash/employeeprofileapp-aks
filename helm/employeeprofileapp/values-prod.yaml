# =====================================
# FILE:
# helm/employeeprofileapp/values-prod.yaml
# VERSION:
# v13-enterprise-secretproviderclass-fixed-final
# =====================================

# =====================================
# APPLICATION
# =====================================

app:

  name: employeeprofileapp

# =====================================
# NAMESPACE
# =====================================

namespaceOverride: employeeprofileapp-prod

# =====================================
# REPLICA CONFIGURATION
# =====================================

replicaCount: 1

revisionHistoryLimit: 3

# =====================================
# IMAGE
# =====================================

image:

  repository: empprofacr2026.azurecr.io/employeeprofileapp-aks

  tag: latest

  pullPolicy: Always

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets: []

# =====================================
# SERVICE ACCOUNT
# =====================================

serviceAccount:

  create: true

  name: employee-sa

  annotations:

    azure.workload.identity/client-id: ""

# =====================================
# WORKLOAD IDENTITY
# =====================================

workloadIdentity:

  enabled: true

  clientId: ""

  tenantId: ""

# =====================================
# POD LABELS
# =====================================

podLabels:

  app: employeeprofileapp

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations:

  azure.workload.identity/use: "true"

# =====================================
# POD SECURITY CONTEXT
# =====================================

podSecurityContext:

  runAsNonRoot: true

  fsGroup: 2000

  seccompProfile:

    type: RuntimeDefault

# =====================================
# CONTAINER SECURITY CONTEXT
# =====================================

securityContext:

  allowPrivilegeEscalation: false

  readOnlyRootFilesystem: false

  runAsNonRoot: true

  runAsUser: 1000

  capabilities:

    drop:

      - ALL

# =====================================
# CONTAINER PORTS
# =====================================

containerPorts:

  http: 8080

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:

  ASPNETCORE_ENVIRONMENT: Production

  ASPNETCORE_URLS: http://+:8080

# =====================================
# ENV FROM SECRET
# =====================================

envFromSecrets:

  enabled: true

  secretName: employeeprofileapp-kv-secret

# =====================================
# SERVICE
# =====================================

service:

  type: ClusterIP

  port: 80

  targetPort: 8080

  annotations: {}

# =====================================
# INGRESS
# =====================================

ingress:

  enabled: true

  className: nginx

  host: prod.employee.local

  path: /employeeprofileapp-prod-release

  pathType: Prefix

  annotations:

    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  tls:

    enabled: false

    secretName: ""

# =====================================
# RESOURCES
# =====================================

resources:

  requests:

    cpu: 100m

    memory: 128Mi

  limits:

    cpu: 500m

    memory: 512Mi

# =====================================
# HORIZONTAL POD AUTOSCALER
# =====================================

hpa:

  enabled: false

  minReplicas: 1

  maxReplicas: 2

  averageUtilization: 70

  memoryAverageUtilization: 80

  stabilizationWindowSeconds: 300

# =====================================
# NODE SELECTOR
# =====================================

nodeSelector: {}

# =====================================
# TOLERATIONS
# =====================================

tolerations: []

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# CONFIGMAP
# =====================================

extraConfig: {}

configMapAnnotations: {}

# =====================================
# NETWORK POLICY
# =====================================

networkPolicy:

  enabled: true

  ingressControllerNamespace: ingress-nginx

# =====================================
# PROBES
# =====================================

livenessProbe:

  enabled: true

  path: /

  initialDelaySeconds: 30

  periodSeconds: 15

  timeoutSeconds: 5

  failureThreshold: 5

readinessProbe:

  enabled: true

  path: /

  initialDelaySeconds: 15

  periodSeconds: 10

  timeoutSeconds: 5

  failureThreshold: 3

startupProbe:

  enabled: false

  path: /

  initialDelaySeconds: 10

  periodSeconds: 10

  timeoutSeconds: 5

  failureThreshold: 30

# =====================================
# TOPOLOGY SPREAD CONSTRAINTS
# =====================================

topologySpreadConstraints: []

# =====================================
# PRIORITY CLASS
# =====================================

priorityClassName: ""

# =====================================
# TERMINATION
# =====================================

terminationGracePeriodSeconds: 30

# =====================================
# VOLUMES
# =====================================

extraVolumes: []

extraVolumeMounts: []

# =====================================
# INIT CONTAINERS
# =====================================

initContainers: []

# =====================================
# SIDECARS
# =====================================

sidecars: []

# =====================================
# SERVICE MONITOR
# =====================================

serviceMonitor:

  enabled: false

  interval: 30s

  scrapeTimeout: 10s

# =====================================
# PROMETHEUS RULES
# =====================================

prometheusRule:

  enabled: false

# =====================================
# POD DISRUPTION BUDGET
# =====================================

podDisruptionBudget:

  enabled: false

  minAvailable: 1

# =====================================
# KEY VAULT
# =====================================

keyVault:

  enabled: true

  keyVaultName: ""

  tenantId: ""

  cloudName: AzurePublicCloud

  secretProviderClass: employeeprofileapp-spc

  k8sSecretName: employeeprofileapp-kv-secret

# =====================================
# SECRET PROVIDER CLASS
# =====================================

secretProviderClass:

  enabled: true

  objects:

    - objectName: db-username
      objectType: secret

    - objectName: db-password
      objectType: secret

# =====================================
# TLS SETTINGS
# =====================================

enable_tls: false

cluster_issuer: ""

# =====================================
# OPTIONAL NGINX SETTINGS
# =====================================

enable_rewrite_target: false

enable_proxy_body_size: false

proxy_body_size: 20m

# =====================================
# EXTRA ANNOTATIONS
# =====================================

deploymentAnnotations: {}

serviceAnnotations: {}

# =====================================
# EXTRA LABELS
# =====================================

commonLabels: {}

# =====================================
# EXTRA POD LABELS
# =====================================

extraPodLabels: {}

# =====================================
# EXTRA POD ANNOTATIONS
# =====================================

extraPodAnnotations: {}

# =====================================
# ROLLOUT STRATEGY
# =====================================

strategy:

  type: RollingUpdate

  rollingUpdate:

    maxSurge: 1

    maxUnavailable: 0

# =====================================
# DNS CONFIG
# =====================================

dnsPolicy: ClusterFirst

dnsConfig: {}

# =====================================
# HOST ALIASES
# =====================================

hostAliases: []

# =====================================
# RUNTIME CLASS
# =====================================

runtimeClassName: ""

# =====================================
# SCHEDULER
# =====================================

schedulerName: default-scheduler
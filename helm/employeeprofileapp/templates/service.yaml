apiVersion: v1
kind: Service

metadata:
  name: {{ default "employeeprofileapp" .Values.app.name }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ default "employeeprofileapp" .Values.app.name }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
# =====================================
# FILE: helm/employeeprofileapp/templates/ingress.yaml
# VERSION: v8-enterprise-public-ip-direct-access-final
# =====================================

{{- if and .Values.ingress .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: {{ default "employeeprofileapp" .Values.app.name }}-ingress

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default "employeeprofileapp" .Values.app.name }}

    app.kubernetes.io/name: {{ default "employeeprofileapp" .Values.app.name }}

    app.kubernetes.io/instance: {{ .Release.Name }}

    app.kubernetes.io/managed-by: Helm

  annotations:

    # =====================================
    # INGRESS CLASS
    # =====================================

    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}

    # =====================================
    # SSL REDIRECT
    # =====================================

    nginx.ingress.kubernetes.io/ssl-redirect: {{ ternary "true" "false" .Values.ingress.tls.enabled | quote }}

    # =====================================
    # OPTIONAL REWRITE TARGET
    # =====================================

    {{- if .Values.enable_rewrite_target }}

    nginx.ingress.kubernetes.io/rewrite-target: "/"

    {{- end }}

    # =====================================
    # OPTIONAL PROXY BODY SIZE
    # =====================================

    {{- if .Values.enable_proxy_body_size }}

    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.proxy_body_size | quote }}

    {{- end }}

    # =====================================
    # OPTIONAL CERT MANAGER
    # =====================================

    {{- if and .Values.enable_tls .Values.cluster_issuer }}

    cert-manager.io/cluster-issuer: {{ .Values.cluster_issuer | quote }}

    {{- end }}

    # =====================================
    # ADDITIONAL USER ANNOTATIONS
    # =====================================

    {{- if .Values.ingress.annotations }}

{{ toYaml .Values.ingress.annotations | indent 4 }}

    {{- end }}

spec:

  ingressClassName: {{ .Values.ingress.className }}

  # =====================================
  # TLS
  # =====================================

  {{- if and .Values.ingress.tls .Values.ingress.tls.enabled }}

  tls:

    - secretName: {{ .Values.ingress.tls.secretName }}

  {{- end }}

  # =====================================
  # RULES
  # =====================================

  rules:

    - http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: {{ default "employeeprofileapp" .Values.app.name }}

                port:

                  number: {{ .Values.service.port }}

{{- end }}
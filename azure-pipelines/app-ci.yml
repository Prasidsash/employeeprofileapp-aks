# =====================================
# FILE: azure-pipelines/app-ci.yml
# VERSION: v11-enterprise-acr-image-validation-final
# =====================================

trigger:

  branches:

    include:

      - main

  paths:

    include:

      - src/**
      - Dockerfile
      - azure-pipelines/app-ci.yml

pool:

  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # DOCKER
  # =====================================

  - name: imageRepository
    value: employeeprofileapp-aks

  - name: dockerfilePath
    value: Dockerfile

  - name: imageTag
    value: $(Build.BuildId)

  # =====================================
  # ACR
  # =====================================

  - name: acrName
    value: empprofacr2026

  # =====================================
  # DOTNET
  # =====================================

  - name: dotnetSdkVersion
    value: 8.0.x

stages:

  # =====================================
  # BUILD STAGE
  # =====================================

  - stage: Build

    displayName: Build Application

    jobs:

      - job: Build

        displayName: Build .NET Application

        steps:

          - checkout: self

            clean: true

          # =====================================
          # INSTALL .NET SDK
          # =====================================

          - task: UseDotNet@2

            displayName: Install .NET SDK

            inputs:

              packageType: sdk

              version: $(dotnetSdkVersion)

          # =====================================
          # REPOSITORY VALIDATION
          # =====================================

          - script: |

              set -euo pipefail

              echo "=================================="
              echo "CURRENT WORKING DIRECTORY"
              echo "=================================="

              pwd

              echo "=================================="
              echo "REPOSITORY CONTENTS"
              echo "=================================="

              find . -type f | sort

            displayName: Repository Validation

          # =====================================
          # RESTORE
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: DotNet Restore

            inputs:

              command: restore

              projects: |
                src/**/*.csproj

          # =====================================
          # BUILD
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: DotNet Build

            inputs:

              command: build

              projects: |
                src/**/*.csproj

              arguments: >
                --configuration Release
                --no-restore

          # =====================================
          # TEST
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: DotNet Test

            continueOnError: true

            inputs:

              command: test

              projects: |
                src/**/*.csproj

              arguments: >
                --configuration Release
                --no-build
                --verbosity normal

          # =====================================
          # PUBLISH
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: DotNet Publish

            inputs:

              command: publish

              publishWebProjects: false

              projects: |
                src/**/*.csproj

              arguments: >
                --configuration Release
                --output $(Build.ArtifactStagingDirectory)/publish
                --no-build

              zipAfterPublish: false

          # =====================================
          # PUBLISH ARTIFACTS
          # =====================================

          - task: PublishBuildArtifacts@1

            displayName: Publish Build Artifacts

            inputs:

              PathtoPublish: $(Build.ArtifactStagingDirectory)/publish

              ArtifactName: drop

              publishLocation: Container

  # =====================================
  # DOCKER BUILD STAGE
  # =====================================

  - stage: Docker

    displayName: Build And Push Docker Image

    dependsOn: Build

    jobs:

      - job: DockerBuild

        displayName: Docker Build And Push

        steps:

          - checkout: self

            clean: true

          # =====================================
          # ACR LOGIN
          # =====================================

          - task: AzureCLI@2

            displayName: ACR Login

            inputs:

              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                az acr login \
                  --name $(acrName)

          # =====================================
          # DOCKER BUILD
          # =====================================

          - script: |

              set -euo pipefail

              docker build \
                --pull \
                -f $(dockerfilePath) \
                -t $(acrName).azurecr.io/$(imageRepository):$(imageTag) \
                -t $(acrName).azurecr.io/$(imageRepository):latest \
                .

            displayName: Docker Build

          # =====================================
          # DOCKER IMAGE VALIDATION
          # =====================================

          - script: |

              set -euo pipefail

              docker images | grep $(imageRepository)

            displayName: Docker Image Validation

          # =====================================
          # DOCKER PUSH
          # =====================================

          - script: |

              set -euo pipefail

              docker push $(acrName).azurecr.io/$(imageRepository):$(imageTag)

              docker push $(acrName).azurecr.io/$(imageRepository):latest

            displayName: Docker Push

          # =====================================
          # IMAGE VALIDATION
          # =====================================

          - task: AzureCLI@2

            displayName: Image Validation

            inputs:

              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                echo "=================================="
                echo "ACR TAGS"
                echo "=================================="

                az acr repository show-tags \
                  --name $(acrName) \
                  --repository $(imageRepository) \
                  --orderby time_desc \
                  --output table

                echo "=================================="
                echo "VALIDATE BUILD IMAGE TAG"
                echo "=================================="

                IMAGE_EXISTS=$(az acr repository show-tags \
                  --name $(acrName) \
                  --repository $(imageRepository) \
                  --query "[?@=='$(imageTag)'] | length(@)" \
                  --output tsv)

                if [ "${IMAGE_EXISTS}" = "0" ]; then
                  echo "ERROR: IMAGE TAG $(imageTag) NOT FOUND"
                  exit 1
                fi

          # =====================================
          # EXPORT IMAGE VARIABLES
          # =====================================

          - script: |

              echo "##vso[task.setvariable variable=IMAGE_TAG]$(imageTag)"

              echo "##vso[task.setvariable variable=IMAGE_REPOSITORY]$(imageRepository)"

            displayName: Export Image Variables

          # =====================================
          # FAILURE DIAGNOSTICS
          # =====================================

          - task: AzureCLI@2

            displayName: Failure Diagnostics

            condition: failed()

            inputs:

              azureSubscription: $(azureInfraServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              addSpnToEnvironment: true

              inlineScript: |

                echo "=================================="
                echo "ACR REPOSITORIES"
                echo "=================================="

                az acr repository list \
                  --name $(acrName) \
                  --output table || true

                echo "=================================="
                echo "ACR TAGS"
                echo "=================================="

                az acr repository show-tags \
                  --name $(acrName) \
                  --repository $(imageRepository) \
                  --output table || true

                echo "=================================="
                echo "DOCKER IMAGES"
                echo "=================================="

                docker images || true
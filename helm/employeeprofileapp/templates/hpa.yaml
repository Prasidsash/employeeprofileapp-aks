apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employeeprofileapp-hpa
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employeeprofileapp
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

# =====================================
# FILE: helm/employeeprofileapp/templates/deployment.yaml
# VERSION: v8-enterprise-disposable-final
# =====================================

apiVersion: apps/v1

kind: Deployment

metadata:

  name: {{ default "employeeprofileapp" .Values.app.name }}

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default .Chart.Name .Values.app.name }}

  annotations:

    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

spec:

  replicas: {{ .Values.replicaCount }}

  revisionHistoryLimit: 5

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 1

      maxSurge: 1

  selector:

    matchLabels:

      app: {{ default .Chart.Name .Values.app.name }}

  template:

    metadata:

      labels:

        app: {{ default .Chart.Name .Values.app.name }}

        # =====================================
        # WORKLOAD IDENTITY LABEL
        # =====================================

        {{- if .Values.workloadIdentity.enabled }}

        azure.workload.identity/use: "true"

        {{- end }}

      {{- if .Values.podAnnotations }}

      annotations:

{{ toYaml .Values.podAnnotations | indent 8 }}

      {{- end }}

    spec:

      # =====================================
      # SERVICE ACCOUNT
      # =====================================

      serviceAccountName: {{ .Values.serviceAccount.name }}

      terminationGracePeriodSeconds: 30

      automountServiceAccountToken: true

      # =====================================
      # OPTIONAL IMAGE PULL SECRETS
      # =====================================

      {{- if .Values.imagePullSecrets }}

      imagePullSecrets:

{{ toYaml .Values.imagePullSecrets | indent 8 }}

      {{- end }}

      # =====================================
      # POD SECURITY CONTEXT
      # =====================================

      securityContext:

{{ toYaml .Values.podSecurityContext | indent 8 }}

      # =====================================
      # NODE SELECTOR
      # =====================================

      {{- if .Values.nodeSelector }}

      nodeSelector:

{{ toYaml .Values.nodeSelector | indent 8 }}

      {{- end }}

      # =====================================
      # TOLERATIONS
      # =====================================

      {{- if .Values.tolerations }}

      tolerations:

{{ toYaml .Values.tolerations | indent 8 }}

      {{- end }}

      # =====================================
      # AFFINITY
      # =====================================

      {{- if .Values.affinity }}

      affinity:

{{ toYaml .Values.affinity | indent 8 }}

      {{- else }}

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchExpressions:

                    - key: app

                      operator: In

                      values:

                        - {{ default .Chart.Name .Values.app.name }}

      {{- end }}

      # =====================================
      # TOPOLOGY SPREAD
      # =====================================

      topologySpreadConstraints:

        - maxSkew: 1

          topologyKey: topology.kubernetes.io/zone

          whenUnsatisfiable: ScheduleAnyway

          labelSelector:

            matchLabels:

              app: {{ default .Chart.Name .Values.app.name }}

      containers:

        - name: {{ default .Chart.Name .Values.app.name }}

          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ default "latest" .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # =====================================
          # CONTAINER SECURITY CONTEXT
          # =====================================

          securityContext:

{{ toYaml .Values.securityContext | indent 12 }}

          ports:

            - name: http

              containerPort: {{ .Values.service.targetPort }}

              protocol: TCP

          # =====================================
          # ENVIRONMENT VARIABLES
          # =====================================

          env:

            - name: ASPNETCORE_ENVIRONMENT

              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}

            - name: ASPNETCORE_URLS

              value: "http://+:{{ .Values.service.targetPort }}"

            - name: KEYVAULT_NAME

              value: {{ .Values.keyVault.keyVaultName | quote }}

            # =====================================
            # WORKLOAD IDENTITY ENV VARIABLES
            # =====================================

            {{- if .Values.workloadIdentity.enabled }}

            - name: AZURE_CLIENT_ID

              value: {{ .Values.workloadIdentity.clientId | quote }}

            - name: AZURE_TENANT_ID

              value: {{ .Values.workloadIdentity.tenantId | quote }}

            - name: AZURE_AUTHORITY_HOST

              value: "https://login.microsoftonline.com/"

            {{- end }}

          # =====================================
          # KEY VAULT SECRET SYNC
          # =====================================

          {{- if .Values.keyVault.enabled }}

          envFrom:

            - secretRef:

                name: {{ .Values.keyVault.k8sSecretName }}

                optional: false

          {{- end }}

          # =====================================
          # AZURE KEY VAULT CSI DRIVER
          # =====================================

          {{- if and .Values.keyVault.enabled .Values.secretMounts.enabled }}

          volumeMounts:

            - name: secrets-store-inline

              mountPath: {{ .Values.secretMounts.mountPath }}

              readOnly: true

            {{- if .Values.extraVolumeMounts }}

{{ toYaml .Values.extraVolumeMounts | indent 12 }}

            {{- end }}

          {{- end }}

          # =====================================
          # STARTUP PROBE
          # =====================================

          {{- if and .Values.startupProbe .Values.startupProbe.enabled }}

          startupProbe:

            httpGet:

              path: {{ .Values.startupProbe.path }}

              port: {{ .Values.service.targetPort }}

            failureThreshold: {{ .Values.startupProbe.failureThreshold }}

            periodSeconds: {{ .Values.startupProbe.periodSeconds }}

          {{- end }}

          # =====================================
          # READINESS PROBE
          # =====================================

          {{- if and .Values.readinessProbe .Values.readinessProbe.enabled }}

          readinessProbe:

            httpGet:

              path: {{ .Values.readinessProbe.path }}

              port: {{ .Values.service.targetPort }}

            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}

            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}

          {{- end }}

          # =====================================
          # LIVENESS PROBE
          # =====================================

          {{- if and .Values.livenessProbe .Values.livenessProbe.enabled }}

          livenessProbe:

            httpGet:

              path: {{ .Values.livenessProbe.path }}

              port: {{ .Values.service.targetPort }}

            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}

            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}

          {{- end }}

          # =====================================
          # RESOURCES
          # =====================================

          resources:

{{ toYaml .Values.resources | indent 12 }}

      # =====================================
      # AZURE KEY VAULT CSI DRIVER
      # =====================================

      {{- if .Values.keyVault.enabled }}

      volumes:

        - name: secrets-store-inline

          csi:

            driver: secrets-store.csi.k8s.io

            readOnly: true

            volumeAttributes:

              secretProviderClass: {{ .Values.keyVault.secretProviderClass }}

        {{- if .Values.extraVolumes }}

{{ toYaml .Values.extraVolumes | indent 8 }}

        {{- end }}

      {{- end }}
# =====================================
# FILE: azure-pipelines/backend-pipeline.yml
# VERSION: v10-enterprise-remote-state-final
# FIXES:
# - retained all original reusable logic
# - retained validation/deployment stages
# - retained debug validation
# - retained export outputs
# - retained OIDC/AzureAD authentication
# - upgraded backend initialization stability
# - fixed ephemeral Azure DevOps backend reconfiguration
# - fixed backend state consistency handling
# - fixed formatting validation stability
# =====================================

trigger: none

pool:
  vmImage: ubuntu-latest

variables:

  - group: employeeprofileapp-dev-vars

  # =====================================
  # TERRAFORM
  # =====================================

  - name: terraformVersion
    value: 1.11.4

  # =====================================
  # TERRAFORM WORKING DIRECTORY
  # =====================================

  - name: terraformWorkingDirectory
    value: $(Build.SourcesDirectory)/terraform/bootstrap/backend

stages:

  # =====================================
  # VALIDATION STAGE
  # =====================================

  - stage: Validation

    displayName: Backend Validation

    jobs:

      - job: BackendValidation

        displayName: Backend Validation

        steps:

          # =====================================
          # CHECKOUT
          # =====================================

          - checkout: self
            clean: true

          # =====================================
          # INSTALL TERRAFORM
          # =====================================

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          # =====================================
          # AZURE LOGIN VALIDATION
          # =====================================

          - task: AzureCLI@2
            displayName: Azure Login Validation
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true

                echo "=================================="
                echo "AZURE ACCOUNT"
                echo "=================================="

                az account show

          # =====================================
          # DEBUG PATH VALIDATION
          # =====================================

          - script: |

              set -euo pipefail

              echo "===== WORKSPACE ROOT ====="
              pwd

              echo "===== FULL REPO STRUCTURE ====="
              ls -R $(Build.SourcesDirectory)

              echo "===== CHECK BACKEND FOLDER ====="
              ls -R $(terraformWorkingDirectory)

            displayName: Debug Terraform Path Validation

          # =====================================
          # TERRAFORM INIT
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Init
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -reconfigure \
                  -upgrade

          # =====================================
          # TERRAFORM FORMAT CHECK
          # =====================================

          - script: |

              set -euo pipefail

              terraform fmt -recursive -check

            displayName: Terraform Format Check
            workingDirectory: $(terraformWorkingDirectory)

          # =====================================
          # TERRAFORM VALIDATE
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Validate
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform validate

          # =====================================
          # TERRAFORM PLAN
          # =====================================

          - task: AzureCLI@2
            displayName: Terraform Plan
            inputs:
              azureSubscription: $(azureInfraServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: $(terraformWorkingDirectory)
              inlineScript: |

                set -euo pipefail

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform plan \
                  -input=false \
                  -out=tfplan

          # =====================================
          # PUBLISH TFPLAN
          # =====================================

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: $(terraformWorkingDirectory)/tfplan
              artifact: backend-tfplan
              publishLocation: pipeline

  # =====================================
  # DEPLOYMENT STAGE
  # =====================================

  - stage: Deployment

    displayName: Backend Deployment

    dependsOn: Validation

    jobs:

      - deployment: BackendDeployment

        displayName: Backend Deployment

        environment: dev

        strategy:

          runOnce:

            deploy:

              steps:

                # =====================================
                # CHECKOUT
                # =====================================

                - checkout: self
                  clean: true

                # =====================================
                # INSTALL TERRAFORM
                # =====================================

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                # =====================================
                # DOWNLOAD TFPLAN
                # =====================================

                - download: current
                  artifact: backend-tfplan

                # =====================================
                # TERRAFORM INIT
                # =====================================

                - task: AzureCLI@2
                  displayName: Terraform Init
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform init \
                        -reconfigure \
                        -upgrade

                # =====================================
                # TERRAFORM APPLY
                # =====================================

                - task: AzureCLI@2
                  displayName: Terraform Apply
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |

                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                      terraform apply \
                        -auto-approve \
                        -input=false \
                        "$(Pipeline.Workspace)/backend-tfplan/tfplan"

                # =====================================
                # EXPORT BACKEND OUTPUTS
                # =====================================

                - task: AzureCLI@2
                  displayName: Export Backend Outputs
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: $(terraformWorkingDirectory)
                    inlineScript: |

                      set -euo pipefail

                      STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)
                      CONTAINER_NAME=$(terraform output -raw container_name)
                      RESOURCE_GROUP=$(terraform output -raw resource_group_name)

                      echo "RESOURCE_GROUP=$RESOURCE_GROUP"
                      echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT"
                      echo "CONTAINER_NAME=$CONTAINER_NAME"

                      echo "##vso[task.setvariable variable=TF_BACKEND_RESOURCE_GROUP]$RESOURCE_GROUP"
                      echo "##vso[task.setvariable variable=TF_BACKEND_STORAGE_ACCOUNT]$STORAGE_ACCOUNT"
                      echo "##vso[task.setvariable variable=TF_BACKEND_CONTAINER]$CONTAINER_NAME"

                # =====================================
                # FINAL BACKEND VALIDATION
                # =====================================

                - task: AzureCLI@2
                  displayName: Backend Validation
                  inputs:
                    azureSubscription: $(azureInfraServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |

                      set -euo pipefail

                      echo "=================================="
                      echo "AZURE ACCOUNT"
                      echo "=================================="

                      az account show || true

                      echo "=================================="
                      echo "RESOURCE GROUPS"
                      echo "=================================="

                      az group list -o table || true

                      echo "=================================="
                      echo "STORAGE ACCOUNTS"
                      echo "=================================="

                      az storage account list -o table || true
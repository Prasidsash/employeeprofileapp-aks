trigger: none

resources:
  pipelines:
  - pipeline: appci
    source: CI

    trigger:
      branches:
        include:
        - main

parameters:
- name: environment
  type: string
  default: dev

pool:
  vmImage: ubuntu-latest

variables:
- group: employeeprofileapp-${{ parameters.environment }}-vars

stages:

- stage: Deploy
  displayName: Deploy To AKS

  jobs:

  - job: HelmDeploy
    displayName: Helm Deployment

    steps:

    - checkout: self

    # =====================================
    # TOOLING VALIDATION
    # =====================================

    - script: |

        echo "=================================="
        echo "Kubectl Version"
        echo "=================================="

        kubectl version --client

        echo "=================================="
        echo "Helm Version"
        echo "=================================="

        helm version

      displayName: Validate Tooling

    # =====================================
    # WAIT FOR AKS READY
    # =====================================

    - task: AzureCLI@2
      displayName: Wait For AKS Ready

      inputs:
        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          az aks wait \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --created

    # =====================================
    # GET AKS CREDENTIALS
    # =====================================

    - task: AzureCLI@2
      displayName: Get AKS Credentials

      inputs:
        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --overwrite-existing

    # =====================================
    # VALIDATE CLUSTER CONNECTIVITY
    # =====================================

    - script: |

        kubectl config current-context

        kubectl get nodes

        kubectl get ns

      displayName: Validate AKS Connectivity

    # =====================================
    # VALIDATE NAMESPACE
    # =====================================

    - script: |

        kubectl get namespace employeeprofileapp-${{ parameters.environment }}

      displayName: Validate Namespace

    # =====================================
    # HELM LINT VALIDATION
    # =====================================

    - script: |

        helm lint helm/employeeprofileapp

      displayName: Helm Lint Validation

    # =====================================
    # HELM DEPLOYMENT
    # =====================================

    - task: HelmDeploy@0
      displayName: Helm Upgrade Install

      inputs:
        connectionType: None

        command: upgrade

        chartType: FilePath

        chartPath: helm/employeeprofileapp

        releaseName: employeeprofileapp-${{ parameters.environment }}

        namespace: employeeprofileapp-${{ parameters.environment }}

        arguments: >
          --install
          --wait
          --timeout 10m
          --atomic
          --debug
          -f helm/employeeprofileapp/values-${{ parameters.environment }}.yaml
          --set image.repository=$(imageRepository)
          --set image.tag=$(resources.pipeline.appci.runName)

    # =====================================
    # DEPLOYMENT VALIDATION
    # =====================================

    - script: |

        kubectl get pods -n employeeprofileapp-${{ parameters.environment }}

        kubectl get svc -n employeeprofileapp-${{ parameters.environment }}

        kubectl rollout status deployment/employeeprofileapp-${{ parameters.environment }} \
          -n employeeprofileapp-${{ parameters.environment }} \
          --timeout=300s

      displayName: Validate Deployment

    # =====================================
    # OPTIONAL TROUBLESHOOTING
    # =====================================

    - script: |

        echo "=================================="
        echo "Deployment Diagnostics"
        echo "=================================="

        kubectl describe deployment employeeprofileapp-${{ parameters.environment }} \
          -n employeeprofileapp-${{ parameters.environment }} || true

      condition: failed()

      displayName: Optional Deployment Diagnostics

    # =====================================
    # OPTIONAL FUTURE ROLLBACK
    # =====================================

    - script: |

        echo "Future rollback placeholder"

        # helm rollback employeeprofileapp-${{ parameters.environment }} 1

      displayName: Future Rollback Placeholder
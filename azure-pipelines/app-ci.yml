name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
- main

parameters:
- name: environment
  type: string
  default: dev

pool:
  vmImage: ubuntu-latest

variables:
- group: employeeprofileapp-${{ parameters.environment }}-vars

stages:

# =========================
# BUILD STAGE
# =========================

- stage: Build
  displayName: Build And Push Docker Image

  jobs:

  - job: DockerBuildPush
    displayName: Docker Build And Push

    steps:

    - checkout: self

    - task: Docker@2
      displayName: Docker Build And Push

      inputs:
        command: buildAndPush

        containerRegistry: $(dockerRegistryServiceConnection)

        repository: $(imageRepository)

        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'

        buildContext: '$(Build.SourcesDirectory)'

        tags: |
          $(Build.BuildNumber)
          latest

# =========================
# DEPLOY STAGE
# =========================

- stage: Deploy
  displayName: Deploy To AKS

  dependsOn: Build

  jobs:

  - job: HelmDeploy
    displayName: Helm Deployment

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: AKS Login

      inputs:
        azureSubscription: 'AKS SCN'

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          echo "Azure Login Successful"

          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --overwrite-existing

          kubectl get nodes

    - task: HelmInstaller@1
      displayName: Install Helm

      inputs:
        helmVersionToInstall: latest

    - script: |

        echo "Starting Helm deployment..."

        helm upgrade --install $(helmReleaseName) ./helm/employeeprofileapp \
          --namespace $(namespace) \
          -f ./helm/employeeprofileapp/values-${{ parameters.environment }}.yaml \
          --set image.repository=$(imageRepository) \
          --set image.tag=$(Build.BuildNumber) \
          --wait \
          --timeout 10m

      displayName: Helm Upgrade Install

    - script: |

        echo "Validating deployment..."

        kubectl get pods -n $(namespace)

        kubectl rollout status deployment/employeeprofileapp-dev \
          -n $(namespace) \
          --timeout=300s

      displayName: Verify Deployment
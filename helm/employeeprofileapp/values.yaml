replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:
  name: ""

# =====================================
# IMAGE
# =====================================

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# =====================================
# SERVICE
# =====================================

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

# =====================================
# OPTIONAL SERVICE SETTINGS
# (Preserves existing behavior)
# =====================================

serviceSettings:
  enableLoadBalancer: false

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:
    cpu: ""
    memory: ""

  limits:
    cpu: ""
    memory: ""

# =====================================
# INGRESS
# =====================================

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: Prefix

# =====================================
# HPA
# =====================================

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  averageUtilization: 70

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:
  ASPNETCORE_ENVIRONMENT: Development
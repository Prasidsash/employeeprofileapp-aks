# =====================================
# FILE: helm/employeeprofileapp/templates/serviceaccount.yaml
# VERSION: v5-enterprise-disposable-final
# =====================================

{{- if .Values.serviceAccount.create }}

apiVersion: v1

kind: ServiceAccount

metadata:

  name: {{ .Values.serviceAccount.name }}

  namespace: {{ .Release.Namespace }}

  labels:

    app: {{ default .Chart.Name .Values.app.name }}

    managed-by: Helm

    {{- if .Values.podLabels }}

{{ toYaml .Values.podLabels | indent 4 }}

    {{- end }}

  annotations:

    # =====================================
    # WORKLOAD IDENTITY ENABLEMENT
    # =====================================

    azure.workload.identity/use: "true"

    # =====================================
    # AZURE CLIENT ID
    # =====================================

    {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.clientId }}

    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}

    {{- end }}

    # =====================================
    # TENANT ID
    # =====================================

    {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.tenantId }}

    azure.workload.identity/tenant-id: {{ .Values.workloadIdentity.tenantId | quote }}

    {{- end }}

    # =====================================
    # ADDITIONAL USER ANNOTATIONS
    # =====================================

    {{- if .Values.serviceAccount.annotations }}

{{ toYaml .Values.serviceAccount.annotations | indent 4 }}

    {{- end }}

automountServiceAccountToken: true

{{- end }}
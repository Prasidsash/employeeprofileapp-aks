name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
- main

parameters:
- name: environment
  type: string
  default: dev

pool:
  vmImage: ubuntu-latest

variables:
- group: employeeprofileapp-${{ parameters.environment }}-vars

stages:

# =========================
# BUILD STAGE
# =========================

- stage: Build
  displayName: Build And Push Docker Image

  jobs:

  - job: DockerBuildPush
    displayName: Docker Build And Push

    steps:

    - checkout: self

    # =====================================
    # Docker Build And Push
    # =====================================

    - task: Docker@2
      displayName: Docker Build And Push

      inputs:
        command: buildAndPush

        containerRegistry: $(dockerRegistryServiceConnection)

        repository: $(imageRepository)

        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'

        buildContext: '$(Build.SourcesDirectory)'

        tags: |
          $(Build.BuildNumber)
          latest

    # =====================================
    # Optional Future Image Scan Placeholder
    # =====================================

    - script: |

        echo "=================================="
        echo "Optional Future Image Scan"
        echo "=================================="

        # trivy image $(imageRepository):$(Build.BuildNumber)

      displayName: Future Image Scan Placeholder
{{- if and .Values.ingress .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: {{ default "employeeprofileapp" .Values.app.name }}-ingress

  labels:
    app: {{ default "employeeprofileapp" .Values.app.name }}

  {{- if .Values.ingress.annotations }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
  {{- end }}

spec:

  ingressClassName: {{ .Values.ingress.className }}

  {{- if and .Values.ingress.tls .Values.ingress.tls.enabled }}
  tls:

    - hosts:
        - {{ .Values.ingress.host }}

      secretName: {{ .Values.ingress.tls.secretName }}

  {{- end }}

  rules:

    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host }}

      http:

        paths:

          - path: {{ .Values.ingress.path }}

            pathType: {{ .Values.ingress.pathType }}

            backend:

              service:
                name: {{ default "employeeprofileapp" .Values.app.name }}

                port:
                  number: {{ .Values.service.port }}
    {{- else }}
    - http:

        paths:

          - path: {{ .Values.ingress.path }}

            pathType: {{ .Values.ingress.pathType }}

            backend:

              service:
                name: {{ default "employeeprofileapp" .Values.app.name }}

                port:
                  number: {{ .Values.service.port }}
    {{- end }}

{{- end }}
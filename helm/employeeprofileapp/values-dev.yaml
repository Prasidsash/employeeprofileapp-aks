# =====================================
# REPLICAS
# =====================================

replicaCount: 1

# =====================================
# APPLICATION
# =====================================

app:
  name: employeeprofileapp-dev

# =====================================
# IMAGE
# =====================================

image:
  repository: prasidsash/employeeprofileapp-aks
  tag: latest
  pullPolicy: Always

# =====================================
# SERVICE
# =====================================

service:
  type: LoadBalancer

  port: 80
  targetPort: 8080

  annotations: {}

  externalTrafficPolicy: ""

  sessionAffinity: ""

  loadBalancerIP: ""

# =====================================
# OPTIONAL SERVICE SETTINGS
# =====================================

serviceSettings:
  enableLoadBalancer: true

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

env:
  ASPNETCORE_ENVIRONMENT: Development

# =====================================
# RESOURCE SETTINGS
# =====================================

resources:

  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "200m"
    memory: "256Mi"

# =====================================
# INGRESS
# =====================================

ingress:
  enabled: false

  className: ""

  host: ""

  path: /
  pathType: Prefix

  annotations: {}

  # =====================================
  # OPTIONAL FUTURE TLS SUPPORT
  # =====================================

  tls:
    enabled: false
    secretName: ""

# =====================================
# HPA
# =====================================

hpa:
  enabled: false

  minReplicas: 2
  maxReplicas: 10

  averageUtilization: 70

  # =====================================
  # OPTIONAL MEMORY METRIC
  # =====================================

  memoryAverageUtilization: null

  # =====================================
  # OPTIONAL FUTURE HPA BEHAVIOR
  # =====================================

  stabilizationWindowSeconds: 300

# =====================================
# NAMESPACE
# =====================================

namespace: employeeprofileapp-dev

# =====================================
# IMAGE PULL SECRETS
# =====================================

imagePullSecrets: []

# =====================================
# POD ANNOTATIONS
# =====================================

podAnnotations: {}

# =====================================
# CONFIGMAP ANNOTATIONS
# =====================================

configMapAnnotations: {}

# =====================================
# OPTIONAL EXTRA CONFIGURATION
# =====================================

extraConfig: {}

# =====================================
# NODE SELECTOR
# =====================================

nodeSelector: {}

# =====================================
# TOLERATIONS
# =====================================

tolerations: []

# =====================================
# AFFINITY
# =====================================

affinity: {}

# =====================================
# SECURITY CONTEXT
# =====================================

securityContext: {}

# =====================================
# PROBES
# =====================================

readinessProbe:
  enabled: false

  path: /
  port: 8080

  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  enabled: false

  path: /
  port: 8080

  initialDelaySeconds: 15
  periodSeconds: 20
# =====================================
# Azure DevOps CI Pipeline
# File: azure-pipelines/app-ci.yaml
# Version: v1.0-final
# =====================================

name: $(Date:yyyyMMdd).$(Rev:r)

# =====================================
# TRIGGER
# =====================================

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - src/**
      - helm/**
      - Dockerfile
      - azure-pipelines/app-ci.yaml

    exclude:
      - terraform/**
      - azure-pipelines/infra-pipeline.yml
      - README.md

# =====================================
# AGENT POOL
# =====================================

pool:
  vmImage: ubuntu-latest

# =====================================
# VARIABLES
# =====================================

variables:

  # =====================================
  # VARIABLE GROUP
  # =====================================

  - group: employeeprofileapp-dev-vars

  # =====================================
  # DOCKER HUB CONFIGURATION
  # =====================================

  - name: dockerRegistryServiceConnection
    value: 'Docker-SC'

  - name: imageRepository
    value: 'prasidsash/employeeprofileapp-aks'

  # =====================================
  # ACR CONFIGURATION
  # =====================================

  - name: acrServiceConnection
    value: 'ACR-SC'

  - name: acrRepository
    value: 'employeeprofileapp-aks'

  # =====================================
  # DOCKER FILE CONFIGURATION
  # =====================================

  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'

  - name: buildContext
    value: '$(Build.SourcesDirectory)'

# =====================================
# STAGES
# =====================================

stages:

  - stage: BuildAndSecurityScan

    displayName: Build Scan And Push

    jobs:

      - job: DockerBuildScanPush

        displayName: Docker Build Scan Push

        steps:

          # =====================================
          # CHECKOUT
          # =====================================

          - checkout: self

          # =====================================
          # TOOLING VALIDATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Docker Version"
              echo "=================================="

              docker --version

            displayName: Validate Docker Tooling

          # =====================================
          # BUILD INFORMATION
          # =====================================

          - script: |

              echo "=================================="
              echo "Build Information"
              echo "=================================="

              echo "Build Number: $(Build.BuildNumber)"
              echo "Source Branch: $(Build.SourceBranchName)"
              echo "ACR Enabled: $(enableAcr)"

            displayName: Build Metadata

          # =====================================
          # .NET RESTORE
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Restore

            inputs:
              command: restore
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'

          # =====================================
          # .NET BUILD
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Build

            inputs:
              command: build
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'
              arguments: '--configuration Release'

          # =====================================
          # .NET TEST
          # =====================================

          - task: DotNetCoreCLI@2

            displayName: Dotnet Test

            inputs:
              command: test
              projects: 'src/Employeeprofileapp/EmployeeProfileApp.csproj'
              arguments: '--configuration Release'

          # =====================================
          # INSTALL TRIVY
          # =====================================

          - script: |

              echo "=================================="
              echo "Install Trivy"
              echo "=================================="

              sudo apt-get update

              sudo apt-get install wget gnupg lsb-release apt-transport-https -y

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
              gpg --dearmor | \
              sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
              sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update

              sudo apt-get install trivy -y

            displayName: Install Trivy

          # =====================================
          # DOCKER HUB BUILD AND PUSH
          # =====================================

          - task: Docker@2

            displayName: Docker Hub Build And Push

            condition: eq(lower(variables['enableAcr']), 'false')

            inputs:

              command: buildAndPush

              containerRegistry: $(dockerRegistryServiceConnection)

              repository: $(imageRepository)

              dockerfile: $(dockerfilePath)

              buildContext: $(buildContext)

              tags: |
                $(Build.BuildNumber)
                latest

          # =====================================
          # ACR LOGIN VALIDATION
          # =====================================

          - task: Docker@2

            displayName: ACR Login

            condition: eq(lower(variables['enableAcr']), 'true')

            inputs:

              command: login

              containerRegistry: $(acrServiceConnection)

          # =====================================
          # ACR BUILD AND PUSH
          # =====================================

          - task: Docker@2

            displayName: ACR Build And Push

            condition: eq(lower(variables['enableAcr']), 'true')

            inputs:

              command: buildAndPush

              containerRegistry: $(acrServiceConnection)

              repository: $(acrRepository)

              dockerfile: $(dockerfilePath)

              buildContext: $(buildContext)

              tags: |
                $(Build.BuildNumber)
                latest

          # =====================================
          # IMAGE SECURITY SCAN
          # =====================================

          - script: |

              echo "=================================="
              echo "Trivy Security Scan"
              echo "=================================="

              if [ "$(enableAcr)" = "true" ]; then

                IMAGE_NAME="$(acrRepository):$(Build.BuildNumber)"

              else

                IMAGE_NAME="$(imageRepository):$(Build.BuildNumber)"

              fi

              echo "Scanning Image: ${IMAGE_NAME}"

              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                --no-progress \
                ${IMAGE_NAME}

            displayName: Trivy Image Scan

          # =====================================
          # PIPELINE COMPLETION
          # =====================================

          - script: |

              echo "=================================="
              echo "Pipeline Completed Successfully"
              echo "=================================="

              echo "Build Number: $(Build.BuildNumber)"
              echo "Branch: $(Build.SourceBranchName)"

            displayName: Pipeline Completion
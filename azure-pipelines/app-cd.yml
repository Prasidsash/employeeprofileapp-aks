trigger: none

parameters:
- name: environment
  type: string
  default: dev

pool:
  vmImage: ubuntu-latest

variables:
- group: employeeprofileapp-${{ parameters.environment }}-vars

stages:

- stage: Deploy
  displayName: Deploy To AKS

  jobs:

  - job: HelmDeploy
    displayName: Helm Deployment

    steps:

    # =====================================
    # WAIT FOR AKS READY
    # =====================================

    - task: AzureCLI@2
      displayName: Wait For AKS Ready
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks wait \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --created

    # =====================================
    # GET AKS CREDENTIALS
    # =====================================

    - task: AzureCLI@2
      displayName: Get AKS Credentials
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --overwrite-existing

    # =====================================
    # VALIDATE CLUSTER CONNECTIVITY
    # =====================================

    - script: |
        kubectl config current-context
        kubectl get nodes
      displayName: Validate AKS Connectivity

    # =====================================
    # HELM DEPLOYMENT
    # =====================================

    - task: HelmDeploy@0
      displayName: Helm Upgrade Install
      inputs:
        connectionType: None
        command: upgrade
        chartType: FilePath
        chartPath: helm/employeeprofileapp
        releaseName: employeeprofileapp-${{ parameters.environment }}
        namespace: employeeprofileapp-${{ parameters.environment }}
        arguments: >
          --install
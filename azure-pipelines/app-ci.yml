name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - src/**
      - helm/**
      - Dockerfile
      - azure-pipelines/app-ci.yml

    exclude:
      - terraform/**
      - azure-pipelines/infra-pipeline.yml
      - README.md

pool:
  vmImage: ubuntu-latest

variables:

  # =====================================
  # VARIABLE GROUP
  # =====================================

  - group: employeeprofileapp-dev-vars

stages:

# =====================================
# BUILD STAGE
# =====================================

- stage: Build
  displayName: Build And Push Docker Image

  jobs:

    - job: DockerBuildPush
      displayName: Docker Build And Push

      steps:

        - checkout: self

        # =====================================
        # TOOLING VALIDATION
        # =====================================

        - script: |

            echo "=================================="
            echo "Docker Version"
            echo "=================================="

            docker --version

          displayName: Validate Docker Tooling

        # =====================================
        # BUILD INFORMATION
        # =====================================

        - script: |

            echo "=================================="
            echo "Build Information"
            echo "=================================="

            echo "Repository: $(imageRepository)"

            echo "Build Number: $(Build.BuildNumber)"

            echo "Source Branch: $(Build.SourceBranchName)"

            echo "Build ID: $(Build.BuildId)"

            echo "Commit ID: $(Build.SourceVersion)"

          displayName: Build Metadata

        # =====================================
        # DOCKER BUILD AND PUSH
        # =====================================

        - task: Docker@2
          displayName: Docker Build And Push

          inputs:
            command: buildAndPush

            containerRegistry: $(dockerRegistryServiceConnection)

            repository: $(imageRepository)

            dockerfile: '$(Build.SourcesDirectory)/Dockerfile'

            buildContext: '$(Build.SourcesDirectory)'

            tags: |
              $(Build.BuildNumber)
              latest

        # =====================================
        # OPTIONAL IMAGE VALIDATION
        # =====================================

        - script: |

            echo "=================================="
            echo "Docker Image Validation"
            echo "=================================="

            echo "Image successfully pushed:"
            echo "$(imageRepository):$(Build.BuildNumber)"

          displayName: Validate Docker Image

        # =====================================
        # OPTIONAL IMAGE PULL VALIDATION
        # =====================================

        - script: |

            echo "=================================="
            echo "Optional Docker Pull Validation"
            echo "=================================="

            docker pull $(imageRepository):$(Build.BuildNumber) || true

          displayName: Optional Image Pull Validation

        # =====================================
        # OPTIONAL FUTURE IMAGE SCAN
        # =====================================

        - script: |

            echo "=================================="
            echo "Optional Future Image Scan"
            echo "=================================="

            # trivy image $(imageRepository):$(Build.BuildNumber)

          displayName: Future Image Scan Placeholder